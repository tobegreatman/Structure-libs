<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国宏观月报</title>
<style>
  /* ══════════ 设计令牌（遵循 DESIGN.md · Stripi-inspired） ══════════ */
  :root{
    --primary:#533afd;        /* indigo · CTA 与链接强调 */
    --primary-deep:#4434d4;
    --primary-press:#2e2b8c;
    --primary-soft:#665efd;
    --primary-bg:#b9b9f9;      /* 淡靛蓝 · 软标签底 */
    --brand-dark:#1c1e54;      /* 深海军蓝 · 精选面板 */
    --ink:#0d253d;             /* 正文墨色，永不用纯黑 */
    --ink-secondary:#273951;
    --ink-mute:#64748d;
    --canvas:#ffffff;
    --canvas-soft:#f6f9fc;     /* 冷调分区底 */
    --canvas-cream:#f5e9d4;    /* 暖色插曲底 */
    --hairline:#e3e8ee;
    --hairline-input:#a8c3de;
    --ruby:#ea2261;            /* 涨 · ruby */
    --magenta:#f96bee;
    --lemon:#9b6829;           /* 滞后标签暖棕 */
    --up:#ea2261;
    --down:#0e9f63;
    --flat:#64748d;
    --shadow-1:rgba(0,55,112,.08) 0 1px 3px;
    --shadow-2:rgba(0,55,112,.08) 0 8px 24px, rgba(0,55,112,.04) 0 2px 6px;
    --ff:"sohne-var","SF Pro Display",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  [v-cloak]{display:none}
  html{scroll-behavior:smooth}
  body{
    background:var(--canvas); color:var(--ink);
    font-family:var(--ff); font-weight:300; font-size:15px; line-height:1.4;
    font-feature-settings:"ss01","tnum";
    -webkit-font-smoothing:antialiased;
  }
  .num{font-feature-settings:"ss01","tnum";letter-spacing:-.42px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  h1,h2,h3{font-weight:300}
  a{color:var(--primary);text-decoration:none}
  a:hover{text-decoration:underline}

  /* ══════════ 渐变网格带（品牌签名 · 大气层深度） ══════════ */
  .mesh-band{position:relative;overflow:hidden;padding:40px 0 64px}
  .mesh{position:absolute;inset:0;width:100%;height:100%;z-index:0}
  .hero-wrap{position:relative;z-index:1}

  /* ══════════ 工具栏（nav-bar-on-mesh） ══════════ */
  .toolbar{
    position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);
    backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--hairline);
  }
  .toolbar-inner{max-width:1080px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{margin-right:auto;display:flex;align-items:baseline;gap:10px}
  .brand-word{font-size:17px;font-weight:400;letter-spacing:-.3px;color:var(--ink)}
  .brand-sub{font-size:10px;font-weight:400;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-mute)}

  /* ══════════ 按钮（紧致药丸 · 交易感） ══════════ */
  .btn{
    appearance:none;border:1px solid transparent;border-radius:9999px;cursor:pointer;
    font-family:var(--ff);font-size:14px;font-weight:400;line-height:1;
    padding:8px 16px;transition:background .15s,color .15s,border-color .15s,transform .15s;
    white-space:nowrap;color:var(--ink);background:var(--canvas);
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-deep)}
  .btn-primary:active{background:var(--primary-press)}
  .btn-ghost{border-color:var(--hairline-input)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}

  /* ══════════ Hero 精选深色卡（card-pricing-featured / 深色应用壳） ══════════ */
  .hero{
    background:var(--brand-dark);color:#fff;border-radius:16px;
    padding:40px 44px;box-shadow:var(--shadow-2);
  }
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .hero-period{font-size:10px;font-weight:400;letter-spacing:1px;text-transform:uppercase;
    background:rgba(255,255,255,.12);color:#fff;border-radius:9999px;padding:5px 12px}
  .hero-meta{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.2px}
  .hero h1{font-size:32px;line-height:1.1;letter-spacing:-.64px;margin-top:16px}
  .hero-cutoff{font-size:13px;color:rgba(255,255,255,.62);margin-top:8px;max-width:70ch}
  .hero-verdict{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:24px;
    padding:14px 20px;border-radius:12px;background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.08)}
  .v-label{font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.45);text-transform:uppercase;white-space:nowrap}
  .v-word{font-size:24px;font-weight:400;line-height:1.2}
  .v-word.v-offense{color:#ff8bb0}
  .v-word.v-neutral{color:#b9b9f9}
  .v-word.v-defense{color:#7ee2ae}
  .v-plain{font-size:12.5px;color:rgba(255,255,255,.72)}
  .hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .chip{font-size:11px;padding:5px 12px;border-radius:9999px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.85)}
  .hero-quote{
    margin-top:22px;padding-left:16px;border-left:3px solid var(--primary-soft);
    font-size:18px;font-weight:300;color:#cfd2fb;letter-spacing:-.2px;line-height:1.5;
  }

  /* ══════════ 分区与卡片 ══════════ */
  main{padding:28px 0 8px}
  section.card{
    background:var(--canvas);border:1px solid var(--hairline);border-radius:12px;
    padding:26px 30px;margin-bottom:20px;box-shadow:var(--shadow-1);
  }
  .sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  h2.sec-title{font-size:22px;letter-spacing:-.22px;color:var(--ink)}
  .sec-tag{font-size:11px;color:var(--ink-mute)}
  .sec-plain{font-size:13px;color:var(--ink-mute);line-height:1.55;margin-bottom:16px;max-width:80ch}

  /* 表格（body-tabular · tnum 金融数字信号） */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{
    text-align:left;color:var(--ink-mute);font-size:10px;font-weight:400;
    letter-spacing:.8px;text-transform:uppercase;padding:8px 10px;
    border-bottom:1px solid var(--hairline);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid #f0f3f7;font-feature-settings:"tnum";letter-spacing:-.2px}
  tr:last-child td{border-bottom:none}
  .tbl-toggle{display:block;margin:16px auto 0;background:var(--canvas);border:1px solid var(--hairline-input);
    color:var(--primary);border-radius:9999px;padding:7px 18px;font-size:12.5px;font-weight:400;
    font-family:var(--ff);cursor:pointer;transition:border-color .15s}
  .tbl-toggle:hover{border-color:var(--primary)}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .miss{color:var(--flat);opacity:.7}

  /* 标签药丸（pill-tag-soft 体系） */
  .pill{display:inline-block;font-size:10px;font-weight:400;letter-spacing:.6px;
    text-transform:uppercase;padding:4px 10px;border-radius:9999px;white-space:nowrap}
  .pill.lead{background:var(--primary-bg);color:var(--primary-deep)}
  .pill.coin{background:var(--canvas-soft);color:var(--ink-mute);border:1px solid var(--hairline)}
  .pill.lag{background:var(--canvas-cream);color:var(--lemon)}

  /* 三栏迷你卡 */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid2{display:grid;grid-template-columns:1fr 2fr;gap:14px}
  .mini{background:var(--canvas-soft);border:1px solid var(--hairline);border-radius:12px;padding:18px 20px}
  .mini h3{font-size:14.5px;font-weight:400;letter-spacing:-.1px;margin-bottom:8px;color:var(--ink)}
  .mini p{font-size:12.8px;color:var(--ink-secondary);line-height:1.55}
  .mini .big{font-size:20px;font-weight:400;letter-spacing:-.4px;margin:2px 0 4px}
  .mini .cap{font-size:11px;color:var(--ink-mute);margin-top:4px}
  .callout{
    margin-top:16px;border-left:3px solid var(--primary);background:#f3f1ff;
    border-radius:0 12px 12px 0;padding:14px 18px;font-size:13.5px;color:var(--ink-secondary);
  }

  /* 状态圆点（利率瀑布 · 深色应用壳内的产品 UI 语义） */
  .card-dark{background:var(--brand-dark);color:#fff;border-radius:16px;padding:28px 32px;margin-bottom:20px;box-shadow:var(--shadow-2)}
  .card-dark h2{color:#fff;font-size:22px;letter-spacing:-.22px}
  .card-dark .sec-plain{color:rgba(255,255,255,.55)}
  .dots{display:flex;align-items:stretch;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
  .dot{
    flex:1 1 180px;font-size:12.5px;line-height:1.5;padding:12px 16px;border-radius:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:rgba(255,255,255,.88)}
  .dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:9999px;margin-right:8px;vertical-align:1px}
  .dot.ok::before{background:#7ee2ae;box-shadow:0 0 8px rgba(126,226,174,.6)}
  .dot.no::before{background:#ff8bb0;box-shadow:0 0 8px rgba(255,139,176,.6)}
  .dot.wait::before{background:#b9b9f9;box-shadow:0 0 8px rgba(185,185,249,.5)}
  .dot .layer{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:4px}
  .dark-minis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
  .dark-mini{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:16px 18px}
  .dark-mini h3{font-size:12px;font-weight:400;color:rgba(255,255,255,.6);letter-spacing:.4px;margin-bottom:8px}
  .dark-mini p{font-size:12.3px;color:rgba(255,255,255,.85);line-height:1.55}
  .dark-mini .big{font-size:19px;font-weight:400;letter-spacing:-.4px}
  .dark-mini .cap{font-size:11px;color:rgba(255,255,255,.42);margin-top:4px}

  /* 周期仪表盘（card-cream-band · 暖色插曲） */
  .card-cream{background:var(--canvas-cream);border:none;border-radius:12px;padding:28px 32px;margin-bottom:20px}
  .card-cream h2{font-size:22px;letter-spacing:-.22px}
  .card-cream .sec-plain{color:#7a5c33}
  .gauge{margin-bottom:18px}
  .gauge .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px}
  .gauge .name{font-size:14px;font-weight:400;white-space:nowrap}
  .gauge .meta{font-size:12px;color:#7a5c33;text-align:right}
  .extreme{color:#c22a55;font-weight:400}
  .track{height:8px;background:#ead9ba;border-radius:9999px;overflow:hidden}
  .fill{height:100%;border-radius:9999px;background:linear-gradient(90deg,var(--primary),var(--primary-soft));transition:width .6s ease}
  .fill.hot{background:linear-gradient(90deg,#c22a55,var(--magenta))}
  .gauge-cap{font-size:11px;color:#7a5c33;margin-top:5px}
  .gauge-cap strong{color:#4a3819;font-weight:400}
  .verdict{margin-top:20px;font-size:14px;color:var(--ink-secondary);line-height:1.55}
  .verdict-pill{
    display:inline-block;margin-left:10px;padding:5px 14px;border-radius:9999px;
    font-size:12px;background:var(--primary);color:#fff;vertical-align:1px}
  .cream-note{font-size:12px;color:#7a5c33;margin-top:10px;line-height:1.5}

  /* 清单 */
  ul.clean{list-style:none;font-size:13px}
  ul.clean li{padding:7px 0;border-bottom:1px solid #f0f0e6;color:var(--ink-secondary);line-height:1.55}
  ul.clean li:last-child{border-bottom:none}

  /* 页脚（footer-light） */
  footer{padding:36px 0 56px;font-size:12.5px;color:var(--ink-mute);line-height:1.8}
  footer strong{font-weight:400;color:var(--ink-secondary)}
  .src-link{color:var(--primary)}

  /* ══════════ 术语悬停（纯 CSS tooltip） ══════════ */
  .term{border-bottom:1px dashed var(--primary);cursor:help;position:relative;-webkit-tap-highlight-color:transparent}
  .term:hover::after,.term:focus::after,.term.term-open::after{
    content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:0;
    background:var(--brand-dark);color:#fff;font-size:12px;font-weight:300;line-height:1.55;
    padding:10px 13px;border-radius:10px;width:max-content;max-width:300px;white-space:normal;
    z-index:99;border:1px solid rgba(255,255,255,.14);box-shadow:var(--shadow-2);pointer-events:none}

  /* ══════════ Toast ══════════ */
  .toast{
    position:fixed;top:66px;right:20px;z-index:1000;display:flex;align-items:center;gap:8px;
    background:var(--brand-dark);color:#fff;font-size:13px;padding:12px 18px;border-radius:12px;
    box-shadow:var(--shadow-2);max-width:360px;line-height:1.5;
    opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast::before{content:"";width:8px;height:8px;border-radius:9999px;flex:none}
  .toast.success::before{background:#7ee2ae}
  .toast.error::before{background:#ff8bb0}
  .toast.info::before{background:#b9b9f9}

  /* 空状态 */
  .empty{padding:24px}
  .empty p{color:var(--ink-mute);font-size:14px}
  .empty code{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--canvas-soft);
    border:1px solid var(--hairline);border-radius:6px;padding:2px 6px}

  /* ══════════ 响应式（768 断点坍缩策略） ══════════ */
  @media (max-width:768px){
    .grid3{grid-template-columns:1fr}
    .grid2{grid-template-columns:1fr}
    .dark-minis{grid-template-columns:1fr}
    .hero{padding:28px 22px}
    .hero h1{font-size:26px}
    section.card,.card-dark,.card-cream{padding:22px 20px}
    .v-word{font-size:20px}
    .gauge .meta{text-align:left}
  }
</style>
</head>

<!-- 精简速用版提示词（与手册附录 B 同源 · 「复制提示词」按钮输出） -->
<script type="text/plain" id="prompt-quick">【角色与执行方式】
你是资深宏观分析师。收到本模板后立即联网取数并完成分析，第一条回复=数据说明+完整JSON报告，禁止"已收到/待命"式开场。若确无联网工具，一句话说明后停止，严禁用训练记忆编造数据。

【五条铁律】
1. 数据必须真实：全部来自本次联网结果，逐项标「来源+发布日期」，取不到标"缺失"，禁止编造。
2. 三值齐全：关键数据同时给「公布值/市场一致预期/前值」，预期缺失填null，禁止用公布值冒充预期。
3. 多源核对：关键数字至少两个独立来源；优先级 官方统计机构/央行 > 专业终端 > 权威财经媒体，降级注明。
4. 先贴标签再解读：每个指标先声明 领先(lead)/同步(coin)/滞后(lag)。
5. 拒绝精确点位：只输出方向、概率、区间。

【时间粒度规范】
- 日频（政策与市场价）：DR007、NCD(1Y)、10Y/2Y国债、人民币中间价、CFETS、美元指数DXY、中美10Y利差 → 取「最新交易日读数 + 近30日区间」。
- 周频（高频探针）：30城商品房成交、两融余额、新开户 → 取「最新周值 + 近4周方向」。
- 月频（核心宏观）：PMI(含新订单/生产/就业/库存分项)、CPI/核心CPI/PPI、社融/M2/M1、工业增加值、社零、出口、工业产成品存货 → 取「最新月 + 近6个月序列」。
- 季频（确认结构）：GDP及支出法四分项（用户要求季报时加挂）。
- 分位基准：默认近3年，极端参照近10年；每个分位必须写明计算基准。

【稳定数据源与防限流】
1. 先按发布日历定位最新期数（PMI=当月最后一天；CPI/PPI=次月9日；出口=次月7日；金融数据=次月10-15日；工业/社零/投资=次月15-17日；LPR=每月20日；工业利润/存货=次月27日前后），避免空搜。
2. 直连官方聚合页批量取数（每站1-2页拿全）：国家统计局最新发布页（一页含PMI/CPI/PPI/工业/社零/投资）；央行金融统计数据报告页（一页拿全社融/M2/M1/信贷结构）；中国货币网（DR007/NCD/中间价/CFETS一站）；中债估值（10Y/2Y曲线一页）；海关总署（出口）；财政部（税收）；中指/克而瑞（地产高频）；美国用BLS与FRED（一站多序列）。
3. 全文搜索仅兜底（全程≤8次）；总外部读取≤20次；同站连续读取≤3次。
4. 降级链（官方→终端→媒体）每级只试1次；同一指标失败2次标"缺失"继续，禁止反复重试。
5. 即读即记「值/来源/发布日期」；同一页面数据多指标复用。

【分析SOP】
1. CPI/PPI：拆核心与食品/猪价扰动（猪价驱动的单月跳升不算通胀信号）；量化PPI→CPI传导时滞（2-4季度）与未来CPI回升区间+可信度（高/中/低）；剪刀差组合定性（PPI高CPI低=利润挤压/双高=全面通胀/双低=通缩）。
2. PMI：扩散指数本质（49.9与50.1无本质区别，禁止"跌破荣枯线=崩溃"式渲染）；新订单-生产剪刀差领先生产1-2个月；库存四阶段定位（主动补/被动补/主动去/被动去）+历史分位；官方vs财新背离=大小企业分化。
3. 库存软硬交叉验证：PMI库存分项（软调查）vs 工业企业产成品存货同比（硬统计），方向一致才可信。
4. 社融/M2四象限：社融升+M2稳=实体回暖/双升M2更快=金融空转/社融弱M2升=只存不借/双降=信用收缩；居民中长贷=地产温度计、企业中长贷=资本开支温度计；社融领先经济2-3个季度。
5. 利率三层瀑布：政策利率（源头）→DR007/NCD（批发价）→LPR（实体价），逐层判通/不通；必报 DR007−政策利率利差（bp，正值偏紧）与 NCD 1Y利率（%）；断流给断点与原因假设。
6. 汇率三问：什么在动（对美元 vs CFETS背离？）→为什么动（必报中美10Y利差bp与DXY作归因旁证）→怎么传导（出口链/进口成本/外债主体）；校准：适度走弱是减震器不是国力记分牌。
7. 每个指标三阶解读：一阶是什么（实际/名义、基数、分项）→二阶边际与预期差（趋势/拐点）→三阶政策与市场反应（反向检查：极好可能见顶，极差可能见底）。
8. 交叉验证：对最重要的1-2个数据用旁证（用电量/税收）三角验证，输出咬合/部分咬合/背离矩阵。
9. 周期定位仪表盘：估值/信贷/情绪/时长四维，每维给历史分位（0-100）+计算基准；≥3项极端且同向才触发行动建议，否则明示"信号不足，维持现状"。
10. 滞后组的坏消息可能是底部特征；顺序：领先组定位→同步组确认→滞后组排雷。

【输出格式】仅输出一个JSON对象，符合 schema/report.schema.json 契约：顶层字段 meta / indicators / signals / cpi_ppi / rate_cascade / fx / cross_validation / cycle_gauge / inventory_cycle / falsification / watchlist / sources 全部必填。关键结构：
- meta：title、period、data_cutoff（按粒度注明各指标所属期数）、generated_at、search_count、completeness{present,total}、missing[]、hero_quote（30字内结构叙事）。
- indicators[]：name、period、published、expected、previous、direction(up/down/flat)、direction_text、label(lead/coin/lag)；三值齐全或标缺失。
- rate_cascade：source/wholesale/retail（各含text+status(ok/no/wait)）+ dr007_policy_spread + ncd_rate + diagnosis。
- fx：what_moves/why_moves/transmission/calibration + us_cn_10y_spread + dxy。
- cycle_gauge.dimensions[]：恰好4维（估值/信贷/情绪/时长），每维含 name、meta、extreme、fill、hot、percentile、baseline；conclusion∈进攻/中性/防御。
- inventory_cycle：stage∈主动补库/被动补库/主动去库/被动去库 + PMI两分项 + 工业存货同比 + percentile。
- cpi_ppi：ppi_yoy/cpi_yoy/core_cpi_yoy/scissors + transmission_lag_quarters + expected_cpi_in_quarters + confidence(高/中/低)。
- falsification[]：证伪条件；watchlist[]：{item,date,focus}；sources[]：{text(数据项→来源机构+发布日期), url(无则null)}。
- 缺失数值填null，缺失字符串填"缺失"。

【交付前自检】JSON.parse可通过；顶层字段齐全；枚举合法；indicators三值齐全或标注缺失；rate_cascade含dr007_policy_spread与ncd_rate；fx含us_cn_10y_spread与dxy；cycle_gauge每维含percentile与baseline；所有数值有sources条目；无精确点位话术。</script>

    <main class="wrap">

      <!-- ── 数据总览 ── -->
      <section class="card">
        <div class="sec-head"><h2 class="sec-title">数据总览</h2><span class="sec-tag">公布值 / 预期 / 前值</span></div>
        <p class="sec-plain">本月关键数据一览：红 = 涨或超预期，绿 = 跌或不及预期，灰 = 持平。正文中带<span class="term" data-tip="鼠标移到带紫色虚线下划线的词上，即可查看通俗解释；手机上点一下即可">虚线</span>的词，悬停（手机上点按）可看通俗解释。</p>
        <table>
          <thead><tr><th>指标</th><th>公布值</th><th>预期</th><th>前值</th><th>方向</th><th>标签</th></tr></thead>

      <!-- ── 三组信号 ── -->
      <section class="card">
        <div class="sec-head"><h2 class="sec-title">三组信号</h2><span class="sec-tag">领先定位 · 同步确认 · 滞后排雷</span></div>
        <p class="sec-plain">领先组预示未来两三个季度，同步组确认当下，滞后组提示风险——三组同向，判断才可信。</p>

      <section class="card">

      <!-- ── 利率三层瀑布（深色应用壳） ── -->

        <div class="dots">

      <!-- ── 汇率三问 ── -->
      <section class="card">
        <div class="sec-head"><h2 class="sec-title">汇率三问</h2><span class="sec-tag">人民币</span></div>
        <p class="sec-plain">先分清是人民币在动还是美元在动，再看原因是什么，最后看对你的钱包有何影响。</p>
        <div class="grid3">
          <div class="mini"><h3>一问 · 什么在动</h3><p>{{ report.fx.what_moves }}</p></div>
          <div class="mini"><h3>二问 · 为什么动</h3><p>{{ report.fx.why_moves }}</p></div>

      <!-- ── 交叉验证 ── -->
      <section class="card">
        <div class="sec-head"><h2 class="sec-title">交叉验证</h2><span class="sec-tag">旁证矩阵</span></div>
        <p class="sec-plain">用用电量、税收等独立数据核对官方增长数字——多个来源方向咬合，数字才可信；持续背离必有故事。</p>
        <table>
          <thead><tr><th>原数据</th><th>旁证一（实物量）</th><th>旁证二（金融类）</th><th>咬合？</th></tr></thead>
          <tbody>
            <tr v-for="(r, i) in report.cross_validation.rows" :key="i">
              <td>{{ r.original }}</td>
              <td>{{ r.evidence1 }}</td>
              <td>{{ r.evidence2 }}</td>
              <td :class="r.fit_class">{{ r.fit }}</td>
            </tr>
          </tbody>
        </table>
        <p class="sec-plain" style="margin:12px 0 0">{{ report.cross_validation.conclusion }}</p>
      </section>

      <!-- ── 周期定位仪表盘（暖色插曲带） ── -->
      <section class="card-cream">
        <div class="sec-head"><h2 class="sec-title">周期定位仪表盘</h2><span class="sec-tag">四维 · 历史分位</span></div>
        <p class="sec-plain">从估值、信贷、情绪、周期时长四个维度给当前经济定位：进度条越靠右越热；分位数字越小，说明比历史上越多时间都冷。四项中至少三项极端且同向，才会给出行动建议。</p>
        <div class="gauge" v-for="(dim, i) in report.cycle_gauge.dimensions" :key="i">
          <div class="row">
            <span class="name">{{ dim.name }}</span>
            <span class="meta" v-html="dim.meta"></span>
          </div>
          <div class="track"><div class="fill" :class="{ hot: dim.hot }" :style="{ width: dim.fill + '%' }"></div></div>
          <div class="gauge-cap">分位：<strong>{{ pctText(dim.percentile) }}</strong> · 基准：{{ dim.baseline || '基准未注明' }}</div>
        </div>
        <div class="verdict">{{ report.cycle_gauge.verdict }}<span class="verdict-pill">结论：{{ report.cycle_gauge.conclusion }}</span></div>
        <p class="cream-note">{{ report.cycle_gauge.note }}</p>
      </section>

      <!-- ── 库存周期 ── -->
      <section class="card">
        <div class="sec-head"><h2 class="sec-title">库存周期定位</h2><span class="sec-tag">软硬交叉验证</span></div>
        <p class="sec-plain">{{ invStagePlain }}</p>
        <div class="grid3">
          <div class="mini">
            <h3>当前阶段</h3>
            <p class="big" :class="invStageCls" style="font-size:19px">{{ report.inventory_cycle.stage }}</p>
            <p class="cap">历史分位：{{ pctText(report.inventory_cycle.percentile) }}</p>
          </div>
          <div class="mini">
            <h3>PMI 库存分项（软调查）</h3>
            <p>原材料库存：<strong class="num">{{ fmtVal(report.inventory_cycle.pmi_raw_inventory) }}</strong></p>
            <p>产成品库存：<strong class="num">{{ fmtVal(report.inventory_cycle.pmi_finished_inventory) }}</strong></p>
          </div>
          <div class="mini">
            <h3>工业产成品存货同比（硬统计）</h3>
            <p class="big">{{ invYoyText }}</p>
            <p class="cap">与 PMI 软硬对照</p>
          </div>
        </div>
      </section>

      <!-- ── 证伪条件 + 观察清单 ── -->
      <section class="card">
        <div class="grid2">
          <div class="mini" style="background:var(--canvas)">
            <h3>证伪条件</h3>
            <p style="margin-bottom:8px;color:var(--ink-mute)">出现以下任一情况，说明本报告判断错了——先想清楚什么能证明自己错，再下结论。</p>
            <ul class="clean"><li v-for="(x, i) in report.falsification" :key="i">{{ x }}</li></ul>
          </div>
          <div class="mini" style="background:var(--canvas)">
            <h3>下月观察清单</h3>
            <p style="margin-bottom:8px;color:var(--ink-mute)">下月重点盯这几件事，答案将揭晓方向。</p>
            <ul class="clean"><li v-for="(w, i) in report.watchlist" :key="i">{{ w.item }} · {{ w.date }} · {{ w.focus }}</li></ul>
          </div>
        </div>
      </section>

      <!-- ── 页脚来源 ── -->
      <footer>
        <strong>数据来源清单</strong><br>
        <span v-for="(s, i) in report.sources" :key="i">
          <template v-if="i > 0"> · </template>
          <a v-if="safeUrl(srcUrl(s))" class="src-link" :href="safeUrl(srcUrl(s))" target="_blank" rel="noopener">{{ srcText(s) }}</a>
          <template v-else>{{ srcText(s) }}</template>
        </span>
        <br><br>
        本报告为数据框架演示与研究参考，不构成投资建议；所有数字以官方发布原文为准。方向标遵循国内惯例：红涨 · 绿跌 · 灰平。
      </footer>
    </main>
  </template>

  <!-- ── 空状态 ── -->
  <div class="wrap empty" v-else>
    <section class="card">
      <h2 class="sec-title" style="margin-bottom:10px">暂无数据</h2>
      <p>点击工具栏「复制提示词」交给 AI / Agent 执行，将输出的 JSON 通过「导入 JSON」载入；或将 JSON 填入 <code>&lt;script id="report-data"&gt;</code>，或通过 <code>?data=xxx.json</code> 加载，或点击「示例数据」查看内置演示。</p>
    </section>
  </div>

  <!-- ── Toast ── -->
  <div class="toast" :class="[toast.type, { show: toast.show }]">{{ toast.msg }}</div>
</div>

<script>
/* ============================================================
   宏观月报 · Vue 3 渲染器
   数据优先级：#report-data（build.js 注入）→ #demo-data（测试数据）
              → ?data=xxx.json → 工具栏导入 JSON。
   报告数据 Object.freeze，跳过响应式代理，渲染轻快。
   ============================================================ */
(function () {
  'use strict';

  /* ── 数据槽读取 ── */
  function parseSlot(id) {
    var el = document.getElementById(id);
    if (!el) return null;
    var txt = el.textContent.trim();
    if (!txt || txt === '{}' || txt === '{ }') return null;
    try { return JSON.parse(txt); } catch (e) { return null; }
  }

  /* ── 数据契约校验（与 build.js 保持一致） ── */
  var REQUIRED_TOP = ['meta','indicators','signals','rate_cascade','fx','cross_validation','cycle_gauge','inventory_cycle','cpi_ppi','falsification','watchlist','sources'];
  var VALID_DIRECTION = ['up','down','flat'];
  var VALID_LABEL = ['lead','coin','lag'];
  var VALID_STATUS = ['ok','no','wait'];
  var VALID_CONCLUSION = ['进攻','中性','防御'];
  var VALID_INV_STAGE = ['主动补库','被动补库','主动去库','被动去库'];
  var VALID_CONF = ['高','中','低'];

  function validateReportData(d) {
    if (!d || typeof d !== 'object') return '数据不是合法对象';
    for (var t = 0; t < REQUIRED_TOP.length; t++) { if (!(REQUIRED_TOP[t] in d)) return '缺少必填顶层字段：' + REQUIRED_TOP[t]; }
    if (!d.meta || typeof d.meta !== 'object') return 'meta 字段无效';
    var META_KEYS = ['title','period','data_cutoff','generated_at','search_count','completeness','missing','hero_quote'];
    for (var i = 0; i < META_KEYS.length; i++) { if (!(META_KEYS[i] in d.meta)) return 'meta 缺少字段：' + META_KEYS[i]; }
    if (!Array.isArray(d.indicators) || d.indicators.length === 0) return 'indicators 不能为空数组';
    for (var j = 0; j < d.indicators.length; j++) {
      var it = d.indicators[j];
      var IT_KEYS = ['name','period','published','label'];
      for (var k = 0; k < IT_KEYS.length; k++) { if (!(IT_KEYS[k] in it)) return 'indicators 条目缺少字段：' + IT_KEYS[k]; }
      if (VALID_LABEL.indexOf(it.label) === -1) return 'indicators label 非法：' + it.label;
      if (it.direction && VALID_DIRECTION.indexOf(it.direction) === -1) return 'indicators direction 非法：' + it.direction;
    }
    var RC_KEYS = ['source','wholesale','retail','diagnosis','dr007_policy_spread','ncd_rate'];
    for (var m = 0; m < RC_KEYS.length; m++) { if (!(RC_KEYS[m] in d.rate_cascade)) return 'rate_cascade 缺少字段：' + RC_KEYS[m]; }
    var RC_LAYERS = ['source','wholesale','retail'];
    for (var n = 0; n < RC_LAYERS.length; n++) {
      if (VALID_STATUS.indexOf(d.rate_cascade[RC_LAYERS[n]].status) === -1) return 'rate_cascade.' + RC_LAYERS[n] + '.status 非法';
    }
    var FX_KEYS = ['what_moves','why_moves','transmission','calibration','us_cn_10y_spread','dxy'];
    for (var p = 0; p < FX_KEYS.length; p++) { if (!(FX_KEYS[p] in d.fx)) return 'fx 缺少字段：' + FX_KEYS[p]; }
    if (!Array.isArray(d.cycle_gauge.dimensions) || d.cycle_gauge.dimensions.length !== 4) return 'cycle_gauge.dimensions 必须为 4 项';
    if (VALID_CONCLUSION.indexOf(d.cycle_gauge.conclusion) === -1) return 'cycle_gauge.conclusion 非法：' + d.cycle_gauge.conclusion;
    for (var q = 0; q < d.cycle_gauge.dimensions.length; q++) {
      var dim = d.cycle_gauge.dimensions[q];
      var DIM_KEYS = ['name','meta','fill','hot','percentile','baseline'];
      for (var r = 0; r < DIM_KEYS.length; r++) { if (!(DIM_KEYS[r] in dim)) return 'cycle_gauge.dimensions[' + q + '] 缺少字段：' + DIM_KEYS[r]; }
    }
    var IC_KEYS = ['stage','pmi_raw_inventory','pmi_finished_inventory','industrial_inventory_yoy','percentile'];
    for (var s = 0; s < IC_KEYS.length; s++) { if (!(IC_KEYS[s] in d.inventory_cycle)) return 'inventory_cycle 缺少字段：' + IC_KEYS[s]; }
    if (VALID_INV_STAGE.indexOf(d.inventory_cycle.stage) === -1) return 'inventory_cycle.stage 非法：' + d.inventory_cycle.stage;
    var CP_KEYS = ['ppi_yoy','cpi_yoy','core_cpi_yoy','scissors','transmission_lag_quarters','expected_cpi_in_quarters','confidence'];
    for (var u = 0; u < CP_KEYS.length; u++) { if (!(CP_KEYS[u] in d.cpi_ppi)) return 'cpi_ppi 缺少字段：' + CP_KEYS[u]; }
    if (VALID_CONF.indexOf(d.cpi_ppi.confidence) === -1) return 'cpi_ppi.confidence 非法：' + d.cpi_ppi.confidence;
    return null;
  }

  /* ── 术语通俗解释词典（模板自动包装，数据端无需配合） ── */
  var TERM_GLOSSARY = {
    '社融': '社会融资规模：实体经济从金融体系拿到钱的总量，相当于经济的"输血量"',
    'M2': '广义货币：全社会钱的总量。增速快不等于"放水"，还要看结构',
    'M1': '狭义货币：现金+企业活期存款，反映资金活跃度，回暖常是经济回升的先兆',
    'LPR': '贷款市场报价利率：银行给最优质客户的贷款利率，房贷、企业贷大多以它为锚',
    'DR007': '银行间7天期拆借利率：银行之间借钱的成本，观察资金面松紧的水银柱',
    '同业存单': '银行发行的借款凭证，其利率反映银行获取资金的成本',
    'NCD': '同业存单（NCD）：银行发行的借款凭证，其利率反映银行资金成本',
    '逆回购': '央行借钱给商业银行的操作，其利率是政策利率、整个利率体系的源头',
    '国债收益率': '市场交易出来的国家借债利率，是所有资产定价的锚',
    '中美利差': '中美两国10年期国债收益率之差：为负（倒挂）时资金倾向流向美国，人民币承压',
    '美元指数': '美元对一篮子货币的强弱指数：美元走强时多数货币被动承压',
    'DXY': '美元指数（DXY）：美元对一篮子货币的强弱，走强时人民币多被动承压',
    'CFETS': '人民币汇率指数：人民币对一篮子货币的加权汇率，比对美元更能反映真实强弱',
    '荣枯线': 'PMI的50分界线：高于50=扩张，低于50=收缩；49.9与50.1并无本质区别',
    'PMI': '采购经理指数：每月最早发布的景气调查，问企业"这个月比上个月好还是差"',
    '核心CPI': '剔除波动大的食品和能源后的CPI，更能看出真实通胀趋势',
    'PPI': '工业生产者出厂价格：工厂卖货的价格，直接影响企业利润',
    'CPI': '居民消费价格指数：老百姓日常开销的价格水平，衡量通胀',
    '剪刀差': 'PPI与CPI涨幅之差：为正说明工厂涨价快于消费端，中下游利润被挤压',
    '收益率曲线': '不同期限国债利率连成的线：短端看央行态度，长端看增长预期，倒挂常预警衰退',
    '主动补库': '企业因订单回暖而主动囤货备产——经济向好的阶段',
    '被动补库': '需求走弱但企业尚未减产，货被动积压——通常是经济放缓信号',
    '主动去库': '需求走弱，企业主动砍生产清库存——下行压力最大的阶段',
    '被动去库': '需求回暖库存被动下降——常是经济见底回升的前夜',
    '两融余额': '融资融券余额：投资者借钱买股票的总量，反映市场情绪冷热',
    'PE': '市盈率：股价÷每股盈利，分位越低说明比历史上越多时间便宜',
    'TTM': '过去12个月滚动计算',
    '历史分位': '当前数值在过去所有时期中的位置：30%分位=比历史上70%的时间都低',
    '社零': '社会消费品零售总额：老百姓买东西的总量，消费冷暖最直接的指标',
    '工业增加值': '工业企业新创造的价值，衡量工厂开工冷热'
  };
  var TERM_RE = new RegExp('(' + Object.keys(TERM_GLOSSARY)
    .sort(function (a, b) { return b.length - a.length; })
    .map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); })
    .join('|') + ')', 'g');

  /* 渲染后扫描文本节点，为词典命中的术语包一层悬停提示（纯 CSS tooltip） */
  function linkTerms(root) {
    if (!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function (node) {
        var p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (p.closest('a, button, .toolbar, .toast, script, style')) return NodeFilter.FILTER_REJECT;
        // 跳过表格首列（指标名）：避免整列虚线噪音
        if (p.tagName === 'TD' && p.cellIndex === 0) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      var text = node.nodeValue;
      TERM_RE.lastIndex = 0;
      if (!TERM_RE.test(text)) return;
      var frag = document.createDocumentFragment();
      var last = 0, m;
      TERM_RE.lastIndex = 0;
      while ((m = TERM_RE.exec(text))) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var span = document.createElement('span');
        span.className = 'term';
        span.setAttribute('data-tip', TERM_GLOSSARY[m[1]]);
        span.textContent = m[1];
        frag.appendChild(span);
        last = m.index + m[1].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  }

  /* ── Vue 应用 ── */
  var VERDICT_PLAIN = {
    '进攻': { cls: 'v-offense', plain: '多个周期信号共振向上 · 可考虑逐步提升风险资产敞口' },
    '中性': { cls: 'v-neutral', plain: '信号不足或方向分歧 · 维持现状，不追涨、不杀跌' },
    '防御': { cls: 'v-defense', plain: '多个周期信号共振转弱 · 宜收缩风险敞口、多留现金' }
  };
  var STAGE_PLAIN = {
    '主动补库': '企业因订单回暖而主动囤货备产——经济向好的阶段',
    '被动补库': '需求走弱但企业尚未减产，货被动积压——通常是经济放缓的信号',
    '主动去库': '需求走弱，企业主动砍生产、清库存——下行压力最大的阶段',
    '被动去库': '需求回暖、库存被动下降——常是经济见底回升的前夜'
  };
  var STAGE_CLS = { '主动补库': 'up', '被动补库': 'flat', '主动去库': 'down', '被动去库': 'flat' };

  var app = Vue.createApp({
    data: function () {
      return {
        report: null,
        expanded: false,
        labelText: { lead: '领先', coin: '同步', lag: '滞后' },
        toast: { msg: '', type: 'info', show: false }
      };
    },
    computed: {
      verdictInfo: function () {
        var c = this.report && this.report.cycle_gauge && this.report.cycle_gauge.conclusion;
        return c ? VERDICT_PLAIN[c] : null;
      },
      missingText: function () {
        var m = this.report && this.report.meta && this.report.meta.missing;
        return (m && m.length) ? m.join(' · ') : '无';
      },
      scissorsText: function () {
        var s = this.report.cpi_ppi.scissors;
        return (s > 0 ? '+' : '') + s + ' pct';
      },
      scissorsCls: function () { return this.report.cpi_ppi.scissors > 0 ? 'up' : 'down'; },
      lagText: function () {
        var q = this.report.cpi_ppi.transmission_lag_quarters;
        return (q === null || q === undefined) ? '—' : q + ' 个季度';
      },
      confCls: function () { return { '高': 'up', '中': 'flat', '低': 'down' }[this.report.cpi_ppi.confidence] || 'flat'; },
      ncdText: function () {
        var v = this.report.rate_cascade.ncd_rate;
        return (v === null || v === undefined) ? '—' : v + '%';
      },
      dxyText: function () {
        var v = this.report.fx.dxy;
        return (v === null || v === undefined) ? '—' : Number(v).toFixed(2);
      },
      invStageCls: function () { return STAGE_CLS[this.report.inventory_cycle.stage] || 'flat'; },
      invStagePlain: function () { return STAGE_PLAIN[this.report.inventory_cycle.stage] || ''; },
      invYoyText: function () {
        var v = this.report.inventory_cycle.industrial_inventory_yoy;
        return (v === null || v === undefined) ? '—' : v + '%';
      }
    },
    watch: {
      report: function () {
        var self = this;
        this.$nextTick(function () { linkTerms(document.getElementById('app')); });
      }
    },
    methods: {
      fmtVal: function (v) {
        return (v === null || v === undefined || v === '') ? '—' : String(v);
      },
      pctText: function (v) { return (v === null || v === undefined) ? '—' : v + '%'; },
      drSpreadText: function (s) {
        if (s === null || s === undefined) return '—';
        var t = s > 5 ? '资金偏紧' : (s < -5 ? '资金偏松' : '资金中性');
        return (s > 0 ? '+' : '') + s + ' bp（' + t + '）';
      },
      drSpreadCls: function (s) {
        if (s === null || s === undefined) return 'flat';
        return s > 5 ? 'up' : (s < -5 ? 'down' : 'flat');
      },
      fxSpreadText: function (s) {
        if (s === null || s === undefined) return '—';
        return (s > 0 ? '+' : '') + s + ' bp（' + (s < 0 ? '中美利率倒挂' : '中美利差为正') + '）';
      },
      fxSpreadCls: function (s) {
        if (s === null || s === undefined) return 'flat';
        return s < 0 ? 'down' : 'up';
      },
      srcText: function (s) { return typeof s === 'string' ? s : (s && s.text) || ''; },
      srcUrl: function (s) { return typeof s === 'string' ? null : (s && s.url) || null; },
      safeUrl: function (u) {
        return (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : null;
      },
      showToast: function (msg, type) {
        var self = this;
        this.toast.msg = msg;
        this.toast.type = type || 'info';
        this.toast.show = true;
        clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(function () { self.toast.show = false; }, 3200);
      },
      applyReport: function (data, opts) {
        opts = opts || {};
        var err = validateReportData(data);
        if (err) {
          this.showToast('数据校验未通过：' + err, 'error');
          return false;
        }
        this.report = Object.freeze(data);
        this.expanded = false;
        document.title = data.meta.title + ' · ' + data.meta.period;
        if (opts.toast) this.showToast(opts.toast, 'success');
        return true;
      },
      /* ── 复制功能（Clipboard API + execCommand 兜底，本地 file:// 可用） ── */
      legacyCopy: function (text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      },
      copyText: function (text, okMsg) {
        var self = this;
        var done = function () { self.showToast(okMsg, 'success'); };
        var fail = function () { self.showToast('复制失败：请改用「导出 JSON」或手动选择文本', 'error'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () {
            self.legacyCopy(text) ? done() : fail();
          });
        } else {
          this.legacyCopy(text) ? done() : fail();
        }
      },
      copyPrompt: function () {
        var el = document.getElementById('prompt-quick');
        this.copyText(el ? el.textContent.trim() : '', '已复制精简提示词 · 粘贴给任意 AI / Agent 即可出报告');
      },
      copySkeleton: function () {
        var el = document.getElementById('json-skeleton');
        this.copyText(el ? el.textContent.trim() : '', '已复制空白 JSON 数据模板');
      },
      /* ── 导入 JSON ── */
      pickFile: function () { document.getElementById('json-file-input').click(); },
      handleFile: function (file) {
        var self = this;
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
          var data;
          try { data = JSON.parse(e.target.result); }
          catch (err) { self.showToast('JSON 解析失败：' + err.message, 'error'); return; }
          if (self.report && !confirm('导入将覆盖当前报告数据，确定继续？')) return;
          self.applyReport(data, { toast: '导入成功：' + data.meta.title + ' · ' + data.meta.period });
        };
        reader.onerror = function () { self.showToast('文件读取失败', 'error'); };
        reader.readAsText(file, 'utf-8');
      },
      /* ── 导出 JSON ── */
      exportJSON: function () {
        if (!this.report) { this.showToast('当前无报告数据可导出', 'error'); return; }
        try {
          var jsonStr = JSON.stringify(this.report, null, 2);
          var blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          var fname = (this.report.meta.period || 'report').replace(/[年月]/g, '-').replace(/\s/g, '') + '.json';
          a.href = url;
          a.download = fname;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          this.showToast('已导出：' + fname, 'success');
        } catch (e) {
          this.showToast('导出失败：' + e.message, 'error');
        }
      },
      /* ── 重置为内置测试数据 ── */
      resetDemo: function () {
        var demo = parseSlot('demo-data');
        if (!demo) { this.showToast('未找到内置测试数据', 'error'); return; }
        if (this.report && !confirm('将载入内置示例数据，覆盖当前报告，确定？')) return;
        this.applyReport(demo, { toast: '已载入内置测试数据：' + demo.meta.period });
      }
    },
    mounted: function () {
      var self = this;

      /* 数据装载：report-data → demo-data → ?data= */
      var embedded = parseSlot('report-data');
      if (embedded) {
        this.applyReport(embedded);
      } else {
        var demo = parseSlot('demo-data');
        if (demo) this.applyReport(demo);
        var qs = new URLSearchParams(location.search).get('data');
        if (qs) {
          fetch(qs).then(function (r) { return r.json(); })
            .then(function (d) { self.applyReport(d, { toast: '已加载：' + d.meta.period }); })
            .catch(function () { self.showToast('?data= 加载失败：' + qs, 'error'); });
        }
      }

      /* 文件导入绑定（input 在 #app 之外，原生监听） */
      var fileInput = document.getElementById('json-file-input');
      fileInput.addEventListener('change', function () {
        if (fileInput.files[0]) self.handleFile(fileInput.files[0]);
        fileInput.value = '';
      });

      /* 触屏设备无 hover：点按术语切换解释 */
      document.addEventListener('click', function (e) {
        var t = e.target.closest ? e.target.closest('.term') : null;
        var open = document.querySelectorAll('.term-open');
        if (!t) { open.forEach(function (x) { x.classList.remove('term-open'); }); return; }
        var wasOpen = t.classList.contains('term-open');
        open.forEach(function (x) { x.classList.remove('term-open'); });
        if (!wasOpen) t.classList.add('term-open');
      });

      this.$nextTick(function () { linkTerms(document.getElementById('app')); });
    }
  }).mount('#app');
})();
</script>
