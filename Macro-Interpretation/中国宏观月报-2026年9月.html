<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国宏观月报</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --sub:#6e6e73;
    --accent:#0071e3; --line:#d2d2d7; --up:#ff3b30; --down:#34c759; --flat:#86868b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;padding:32px 16px;max-width:980px;margin:0 auto}
  .hero{background:#000;color:#fff;border-radius:28px;padding:48px 40px;margin-bottom:28px}
  .hero h1{font-size:32px;font-weight:600;letter-spacing:.1px}
  .hero p{font-size:17px;color:rgba(255,255,255,.72);margin-top:8px}
  .chips{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .chip{font-size:12px;padding:5px 12px;border-radius:980px;background:rgba(255,255,255,.14)}
  .hero-quote{font-size:21px;font-weight:600;margin-top:24px;color:#2997ff}
  .hero-verdict{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:24px;
    padding:14px 20px;border-radius:16px;background:rgba(255,255,255,.1)}
  .v-label{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:2px;white-space:nowrap}
  .v-word{font-size:28px;font-weight:700;line-height:1.2}
  .v-plain{font-size:13px;color:rgba(255,255,255,.78)}
  .v-offense{color:#ff453a}.v-neutral{color:#f5f5f7}.v-defense{color:#30d158}
  section{background:var(--card);border-radius:18px;padding:26px 28px;margin-bottom:20px;
    box-shadow:0 1px 3px rgba(0,0,0,.05)}
  h2{font-size:21px;font-weight:600;margin-bottom:16px}
  h2 .tag{font-size:12px;font-weight:400;color:var(--sub);margin-left:8px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--sub);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 10px;border-bottom:1px solid #f0f0f3}
  tr:last-child td{border-bottom:none}
  .tbl-ind tr.extra{display:none}
  .tbl-ind.expanded tr.extra{display:table-row}
  .tbl-toggle{display:block;margin:16px auto 0;background:#fff;border:1px solid var(--line);color:var(--accent);
    border-radius:980px;padding:7px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:border-color .15s}
  .tbl-toggle:hover{border-color:var(--accent)}
  .num{font-variant-numeric:tabular-nums;font-weight:600}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px}
  .pill.lead{background:#e8f1fd;color:var(--accent)}
  .pill.coin{background:#f2f2f4;color:var(--sub)}
  .pill.lag{background:#fdf0e8;color:#b25000}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  @media (max-width:760px){.grid3{grid-template-columns:1fr}}
  .mini{background:#fafafc;border:1px solid var(--line);border-radius:14px;padding:18px}
  .mini h3{font-size:15px;font-weight:600;margin-bottom:8px}
  .mini p{font-size:13px;color:var(--sub)}
  .dots{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .dot{font-size:12px;padding:4px 12px;border-radius:980px;border:1px solid var(--line)}
  .dot.ok{background:#e8f8ee;color:#1d8a4e;border-color:#bfe8cf}
  .dot.no{background:#fdecea;color:#c0392b;border-color:#f5c6c0}
  .dot.wait{background:#f2f2f4;color:var(--sub)}
  .callout{border-left:4px solid var(--accent);background:#f0f6ff;border-radius:0 12px 12px 0;
    padding:14px 18px;font-size:14px}
  .gauge{margin-bottom:18px}
  .gauge .row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
  .gauge .name{font-weight:600;white-space:nowrap}
  .gauge .meta{color:var(--sub);font-size:12px}
  .extreme{color:#c0392b;font-weight:700}
  .sec-plain{font-size:13px;color:var(--sub);margin:-10px 0 16px;line-height:1.5}
  .term{border-bottom:1px dashed #2997ff;cursor:help;position:relative;-webkit-tap-highlight-color:transparent}
  .term:hover::after,.term:focus::after,.term.term-open::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:0;
    background:#1d1d1f;color:#fff;font-size:12px;font-weight:400;padding:9px 12px;border-radius:10px;
    width:max-content;max-width:300px;line-height:1.55;white-space:normal;z-index:99;
    border:1px solid rgba(255,255,255,.14);box-shadow:0 6px 20px rgba(0,0,0,.35);pointer-events:none}
  @media (hover:none){.term{cursor:pointer}}
  .track{height:8px;background:#ececef;border-radius:980px;overflow:hidden}
  .fill{height:100%;border-radius:980px;background:linear-gradient(90deg,#0071e3,#2997ff);
    transition:width .6s ease}
  .fill.hot{background:linear-gradient(90deg,#ff6b3d,#ff3b30)}
  .verdict{margin-top:18px;font-size:15px;font-weight:600}
  .verdict .pill{font-size:13px;padding:6px 16px;margin-left:10px}
  ul.clean{list-style:none;font-size:14px}
  ul.clean li{padding:7px 0;border-bottom:1px solid #f0f0f3}
  ul.clean li:last-child{border-bottom:none}
  footer{color:var(--sub);font-size:12px;padding:8px 4px 24px;line-height:1.8}

  /* ── 导入 JSON 控件 ── */
  .import-btn{position:fixed;top:20px;right:20px;z-index:999;
    background:var(--accent);color:#fff;border:none;border-radius:980px;
    padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,113,227,.35);transition:transform .15s,box-shadow .15s}
  .import-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,113,227,.45)}
  .import-btn:active{transform:translateY(0)}
  .export-btn{position:fixed;top:20px;right:140px;z-index:999;
    background:#fff;color:var(--accent);border:1px solid var(--accent);border-radius:980px;
    padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s}
  .export-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.12)}
  .export-btn:active{transform:translateY(0)}
  #json-file-input{display:none}
  .toast{position:fixed;top:70px;right:20px;z-index:1000;
    padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;
    box-shadow:0 4px 16px rgba(0,0,0,.15);max-width:340px;
    opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast.success{background:#e8f8ee;color:#1d8a4e;border:1px solid #bfe8cf}
  .toast.error{background:#fdecea;color:#c0392b;border:1px solid #f5c6c0}
  .toast.info{background:#e8f1fd;color:var(--accent);border:1px solid #cfe0f8}
</style>
</head>

<script>
/* ============================================================
   宏观月报 · 数据驱动渲染器
   读取 #report-data 或 ?data= 参数的 JSON，渲染为完整报告。
   ============================================================ */
(function () {
  'use strict';

  const LABEL_TEXT = { lead: '领先', coin: '同步', lag: '滞后' };

  function esc(s) {
    // 文本转义（防止 XSS），null/undefined 渲染为 —
    if (s === null || s === undefined || s === '') return '—';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function raw(s) {
    // 允许少量 HTML 的字段（如 cycle_gauge meta 中的 <span class='extreme'>）
    if (s === null || s === undefined || s === '') return '—';
    return String(s);
  }

  function fmtVal(v) {
    if (v === null || v === undefined) return '—';
    if (v === '缺失') return '<span class="flat">缺失</span>';
    return esc(v);
  }

  function renderHero(d) {
    const m = d.meta;
    const miss = (m.missing && m.missing.length) ? m.missing.join(' · ') : '无';
    const VERDICT_PLAIN = {
      '进攻': {cls: 'v-offense', plain: '多个周期信号共振向上 · 可考虑逐步提升风险资产敞口'},
      '中性': {cls: 'v-neutral', plain: '信号不足或方向分歧 · 维持现状，不追涨、不杀跌'},
      '防御': {cls: 'v-defense', plain: '多个周期信号共振转弱 · 宜收缩风险敞口、多留现金'}
    };
    const cc = d.cycle_gauge && d.cycle_gauge.conclusion;
    const v = cc ? VERDICT_PLAIN[cc] : null;
    const verdictHtml = v ? `
  <div class="hero-verdict">
    <span class="v-label">本期结论</span>
    <span class="v-word ${v.cls}">${esc(cc)}</span>
    <span class="v-plain">${esc(v.plain)}</span>
  </div>` : '';
    return `
<div class="hero">
  <h1>${esc(m.title)}</h1>
  <p>数据截至 ${esc(m.data_cutoff)} · 生成于 ${esc(m.generated_at)} · 本期共执行 ${m.search_count} 次联网搜索</p>
  ${verdictHtml}
  <div class="chips">
    <span class="chip">数据完整度：${m.completeness.present}/${m.completeness.total} 项</span>
    <span class="chip">缺失：${esc(miss)}</span>
    <span class="chip">红涨 · 绿跌 · 灰平</span>
  </div>
  <div class="hero-quote">${esc(m.hero_quote)}</div>
</div>`;
  }

  function renderIndicators(d) {
    const PREVIEW = 8; // 收起时预览行数
    const total = d.indicators.length;
    const rows = d.indicators.map((it, i) => {
      const pub = fmtVal(it.published);
      const exp = fmtVal(it.expected);
      const prev = fmtVal(it.previous);
      const dirCls = it.direction || 'flat';
      const dirText = esc(it.direction_text || '');
      const label = it.label || 'coin';
      const extraCls = i >= PREVIEW ? ' class="extra"' : '';
      return `<tr${extraCls}>
        <td>${esc(it.name)}（${esc(it.period)}）</td>
        <td class="num">${pub}</td>
        <td>${exp}</td>
        <td>${prev}</td>
        <td class="${dirCls}">${dirText}</td>
        <td><span class="pill ${label}">${LABEL_TEXT[label]}</span></td>
      </tr>`;
    }).join('');
    const toggle = total > PREVIEW ? `
  <button class="tbl-toggle" data-total="${total}" aria-expanded="false">展开全部（共 ${total} 项）</button>` : '';
    return `
<section>
  <h2>数据总览<span class="tag">公布值 / 预期 / 前值</span></h2>
  <div class="sec-plain">本月关键数据一览：红=涨或超预期，绿=跌或不及预期，灰=持平。正文中带<span class="term" data-tip="鼠标移到带蓝色虚线下划线的词上，即可查看通俗解释；手机上点一下即可">虚线</span>的词，悬停（手机上点按）可看通俗解释。</div>
  <table class="tbl-ind">
    <tr><th>指标</th><th>公布值</th><th>预期</th><th>前值</th><th>方向</th><th>标签</th></tr>
    ${rows}
  </table>
  ${toggle}
</section>`;
  }

  function renderSignals(d) {
    const s = d.signals;

<section>
  <h2>三组信号<span class="tag">领先定位 · 同步确认 · 滞后排雷</span></h2>
  <div class="sec-plain">领先组预示未来两三个季度，同步组确认当下，滞后组提示风险——三组同向，判断才可信。</div>
  <div class="grid3">
    <div class="mini"><h3>领先组在说什么</h3><p>${esc(s.leading)}</p></div>
    <div class="mini"><h3>同步组在说什么</h3><p>${esc(s.coincident)}</p></div>
    <div class="mini"><h3>滞后组在说什么</h3><p>${esc(s.lagging)}</p></div>
  </div>
  <div class="callout" style="margin-top:16px">
    <strong>信号一致性：</strong>${esc(s.consistency)}
  </div>
</section>`;
  }

  function renderRateCascade(d) {
    const r = d.rate_cascade;
    const spread = r.dr007_policy_spread;
    const spreadTxt = spread === null || spread === undefined ? '—'
      : (spread > 0 ? '+' : '') + spread + ' bp（' + (spread > 5 ? '资金偏紧' : spread < -5 ? '资金偏松' : '资金中性') + '）';
    const spreadCls = spread === null || spread === undefined ? 'flat' : (spread > 5 ? 'up' : spread < -5 ? 'down' : 'flat');
    const ncd = r.ncd_rate;
    const ncdTxt = ncd === null || ncd === undefined ? '—' : ncd + '%';
    return `
<section>
  <h2>利率传导 · 三层瀑布</h2>

  /* ── 术语通俗解释词典：悬停显示，模板自动包装，数据端无需配合 ── */

  const TERM_RE = new RegExp('(' + Object.keys(TERM_GLOSSARY)
    .sort((a, b) => b.length - a.length)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
    .join('|') + ')', 'g');

  /* 渲染后扫描文本节点，为词典命中的术语包一层悬停提示（tooltip 样式纯 CSS） */
  function linkTerms(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const node of nodes) {
      // 跳过指标总览表首列（指标名）：避免整列虚线噪音，术语解释已在正文各处提供
      if (node.parentElement && node.parentElement.closest &&
          node.parentElement.closest('.tbl-ind td:first-child')) continue;
      const text = node.nodeValue;
      TERM_RE.lastIndex = 0;
      if (!TERM_RE.test(text)) continue;
      const frag = document.createDocumentFragment();
      let last = 0, m;
      TERM_RE.lastIndex = 0;
      while ((m = TERM_RE.exec(text))) {
        if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        const span = document.createElement('span');
        span.className = 'term';
        span.dataset.tip = TERM_GLOSSARY[m[1]];
        span.textContent = m[1];
        frag.appendChild(span);
        last = m.index + m[1].length;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  }

  /* ── 导入 JSON 功能 ── */
  let currentData = null;
  let toastTimer = null;

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || 'info');
    // 触发重排以启动动画

  // 数据契约校验：检查顶层必填字段与枚举值
  const REQUIRED_TOP = ['meta','indicators','signals','rate_cascade','fx','cross_validation','cycle_gauge','inventory_cycle','cpi_ppi','falsification','watchlist','sources'];
  const VALID_DIRECTION = ['up','down','flat'];
  const VALID_LABEL = ['lead','coin','lag'];
  const VALID_STATUS = ['ok','no','wait'];
  const VALID_CONCLUSION = ['进攻','中性','防御'];
  const VALID_INV_STAGE = ['主动补库','被动补库','主动去库','被动去库'];
  const VALID_CONF = ['高','中','低'];

  function validateReportData(d) {
    if (!d || typeof d !== 'object') return '数据不是合法对象';
    for (const k of REQUIRED_TOP) {
      if (!(k in d)) return '缺少必填顶层字段：' + k;
    }
    // meta
    if (!d.meta || typeof d.meta !== 'object') return 'meta 字段无效';
    for (const k of ['title','period','data_cutoff','generated_at','search_count','completeness','missing','hero_quote']) {
      if (!(k in d.meta)) return 'meta 缺少字段：' + k;
    }
    // indicators
    if (!Array.isArray(d.indicators) || d.indicators.length === 0) return 'indicators 不能为空数组';
    for (const it of d.indicators) {
      for (const k of ['name','period','published','label']) {
        if (!(k in it)) return 'indicators 条目缺少字段：' + k;
      }
      if (!VALID_LABEL.includes(it.label)) return 'indicators label 非法：' + it.label;
      if (it.direction && !VALID_DIRECTION.includes(it.direction)) return 'indicators direction 非法：' + it.direction;
    }
    // rate_cascade
    for (const k of ['source','wholesale','retail','diagnosis','dr007_policy_spread','ncd_rate']) {
      if (!(k in d.rate_cascade)) return 'rate_cascade 缺少字段：' + k;
    }
    for (const k of ['source','wholesale','retail']) {
      if (!VALID_STATUS.includes(d.rate_cascade[k].status)) return 'rate_cascade.' + k + '.status 非法';
    }
    // fx
    for (const k of ['what_moves','why_moves','transmission','calibration','us_cn_10y_spread','dxy']) {
      if (!(k in d.fx)) return 'fx 缺少字段：' + k;
    }
    // cycle_gauge
    if (!Array.isArray(d.cycle_gauge.dimensions) || d.cycle_gauge.dimensions.length !== 4) return 'cycle_gauge.dimensions 必须为 4 项';
    if (!VALID_CONCLUSION.includes(d.cycle_gauge.conclusion)) return 'cycle_gauge.conclusion 非法：' + d.cycle_gauge.conclusion;
    for (let i = 0; i < d.cycle_gauge.dimensions.length; i++) {
      const dim = d.cycle_gauge.dimensions[i];
      for (const k of ['name','meta','fill','hot','percentile','baseline']) {
        if (!(k in dim)) return 'cycle_gauge.dimensions[' + i + '] 缺少字段：' + k;
      }
    }
    // inventory_cycle
    for (const k of ['stage','pmi_raw_inventory','pmi_finished_inventory','industrial_inventory_yoy','percentile']) {
      if (!(k in d.inventory_cycle)) return 'inventory_cycle 缺少字段：' + k;
    }
    if (!VALID_INV_STAGE.includes(d.inventory_cycle.stage)) return 'inventory_cycle.stage 非法：' + d.inventory_cycle.stage;
    // cpi_ppi
    for (const k of ['ppi_yoy','cpi_yoy','core_cpi_yoy','scissors','transmission_lag_quarters','expected_cpi_in_quarters','confidence']) {
      if (!(k in d.cpi_ppi)) return 'cpi_ppi 缺少字段：' + k;
    }
    if (!VALID_CONF.includes(d.cpi_ppi.confidence)) return 'cpi_ppi.confidence 非法：' + d.cpi_ppi.confidence;
    return null; // 校验通过
  }

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      let data;
      try {
        data = JSON.parse(e.target.result);
      } catch (err) {
        showToast('JSON 解析失败：' + err.message, 'error');
        return;
      }
      const err = validateReportData(data);
      if (err) {
        showToast('数据校验未通过：' + err, 'error');
        return;
      }
      // 已有数据时二次确认
      if (currentData) {
        if (!confirm('导入将覆盖当前报告数据，确定继续？')) {
          document.getElementById('json-file-input').value = '';
          return;
        }
      }
      boot(data);
      showToast('导入成功：' + data.meta.title + ' · ' + data.meta.period, 'success');
    };
    reader.onerror = function () {
      showToast('文件读取失败', 'error');
    };
    reader.readAsText(file, 'utf-8');
  }

  // 绑定导入控件
  // 触屏设备无 hover：点按术语切换解释，再次点按或点页面任意空白处关闭
  document.addEventListener('click', function (e) {
    const t = e.target.closest ? e.target.closest('.term') : null;
    const open = document.querySelectorAll('.term-open');
    if (!t) {
      open.forEach(function (x) { x.classList.remove('term-open'); });
      return;
    }
    const wasOpen = t.classList.contains('term-open');
    open.forEach(function (x) { x.classList.remove('term-open'); });
    if (!wasOpen) t.classList.add('term-open');
  });

  // 数据总览表：展开/收起（超过预览行数时显示切换按钮）
  document.addEventListener('click', function (e) {
    const btn = e.target.closest('.tbl-toggle');
    if (!btn) return;
    const table = btn.parentElement.querySelector('.tbl-ind');
    if (!table) return;
    const expanded = table.classList.toggle('expanded');
    btn.textContent = expanded ? '收起' : '展开全部（共 ' + btn.dataset.total + ' 项）';
    btn.setAttribute('aria-expanded', String(expanded));
  });

  const importBtn = document.getElementById('import-btn');
  const fileInput = document.getElementById('json-file-input');
  importBtn.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    const f = fileInput.files[0];
    handleFile(f);
    // 复位 value，允许重复导入同一文件
    fileInput.value = '';
  });

  // 绑定导出控件
  const exportBtn = document.getElementById('export-btn');
  exportBtn.addEventListener('click', function () {
    if (!currentData) {
      showToast('当前无报告数据可导出', 'error');
      return;
    }
    try {
      const jsonStr = JSON.stringify(currentData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const fname = (currentData.meta && currentData.meta.period ? currentData.meta.period : 'report')
        .replace(/[年月]/g, '-').replace(/\s/g, '') + '.json';
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('已导出：' + fname, 'success');
    } catch (e) {
      showToast('导出失败：' + e.message, 'error');
    }
  });

  // 优先读取嵌入式 JSON；无则尝试 ?data= 参数
  const embedded = loadEmbedded();
  if (embedded) {
    boot(embedded);
  } else {
    loadFromQuery().then(boot);
  }
})();
</script>

</body>
</html>
