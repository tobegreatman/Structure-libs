<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股市场主线分析 · Mainline Radar</title>
<style>
/* Inter 自托管（vendor/fonts，latin 子集，300/400/500）：不依赖 fonts.gstatic.com，file:// 直开也能拿到字形 */
@font-face{
  font-family:'Inter';font-style:normal;font-weight:300;font-display:swap;
  src:url('vendor/fonts/inter-latin-300.woff2') format('woff2');
}
@font-face{
  font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;
  src:url('vendor/fonts/inter-latin-400.woff2') format('woff2');
}
@font-face{
  font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;
  src:url('vendor/fonts/inter-latin-500.woff2') format('woff2');
}
:root{
  --primary:#533afd; --primary-deep:#4434d4; --primary-press:#2e2b8c; --primary-soft:#665efd;
  --primary-sub:#b9b9f9; --navy:#1c1e54; --ink:#0d253d; --ink2:#273951; --mute:#64748d;
  --canvas:#fff; --soft:#f6f9fc; --cream:#f5e9d4; --line:#e3e8ee; --line-in:#a8c3de;
  --up:#ea2261; --down:#0f9d70; --warn:#9b6829;
  --sh1:0 1px 3px rgba(0,55,112,.08);
  --sh2:0 8px 24px rgba(0,55,112,.08),0 2px 6px rgba(0,55,112,.04);
  --pill:9999px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  font-size:15px;font-weight:300;line-height:1.4;letter-spacing:0;
  font-feature-settings:"ss01";-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0;font-weight:300}
p{margin:0}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-feature-settings:"ss01","tnum";letter-spacing:-.42px}
.up{color:var(--up)}
.down{color:var(--down)}
.mute{color:var(--mute)}
/* 小字号的 eyebrow 不再用 opacity 压淡：10px 字叠加透明度会把对比度压到 4.5:1 以下 */
.eyebrow{font-size:10px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:#5a6b82}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid rgba(227,232,238,.9)}
.nav-in{max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:400;letter-spacing:.01em;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(83,58,253,.13)}
.brand small{font-weight:300;color:var(--mute);font-size:10px;letter-spacing:.12em;margin-left:2px}
.nav-links{position:relative;display:flex;gap:4px;margin-left:6px}
.nav-links a{position:relative;font-size:13px;color:var(--mute);padding:7px 11px 10px;border-radius:7px;font-weight:400;letter-spacing:.01em;white-space:nowrap;transition:color .18s,background .18s}
.nav-links a:hover{color:var(--ink);background:rgba(13,37,61,.045)}
.nav-links a.on{color:var(--ink)}
/* 滑动指示条：宽度与位置由 JS 量出后写入 --ink-x / --ink-w */
.nav-links .nav-bar{position:absolute;left:0;bottom:3px;height:2px;width:var(--ink-w,0px);border-radius:2px;
  background:linear-gradient(90deg,var(--primary),var(--primary-soft));
  transform:translateX(var(--ink-x,0px));opacity:0;pointer-events:none;
  transition:transform .4s cubic-bezier(.22,.61,.36,1),width .4s cubic-bezier(.22,.61,.36,1),opacity .26s ease}
.nav-links.ink-on .nav-bar{opacity:1}
@media (prefers-reduced-motion:reduce){
  .nav-links .nav-bar{transition:opacity .2s}
}
/* 页签不换行：宽度不足时直接隐藏，避免折成两行把导航撑高 */
@media (max-width:960px){ .nav-links{display:none} }
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:400;line-height:1;border-radius:var(--pill);padding:9px 16px;border:1px solid transparent;cursor:pointer;transition:background .16s,border-color .16s,color .16s;white-space:nowrap;text-decoration:none;flex:0 0 auto}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-deep)}
.btn-primary:active{background:var(--primary-press)}
.btn-ghost{background:#fff;color:var(--primary);border-color:var(--primary)}
.btn-ghost:hover{background:rgba(83,58,253,.06)}
.btn-quiet{background:#fff;color:var(--ink2);border-color:var(--line)}
.btn-quiet:hover{border-color:var(--line-in);color:var(--ink)}
.btn-sm{padding:7px 12px;font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:400;padding:4px 9px;border-radius:var(--pill);background:var(--cream);color:var(--warn);letter-spacing:.02em}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;padding:76px 0 0}
.mesh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mesh-fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,0) 16%,rgba(255,255,255,0) 54%,rgba(255,255,255,.78) 86%,#fff 100%);pointer-events:none}
.hero-in{position:relative;max-width:1200px;margin:0 auto;padding:0 24px}
h1.display{font-size:56px;font-weight:300;line-height:1.04;letter-spacing:-1.1px;margin:16px 0 0;color:var(--ink)}
.sub-lead{font-size:16px;font-weight:300;line-height:1.55;color:var(--ink2);max-width:760px;margin-top:16px}
.stat-row{display:flex;flex-wrap:wrap;gap:0;margin-top:36px;border-top:1px solid rgba(13,37,61,.1);padding-top:18px;max-width:760px}
.stat{flex:1 1 120px;padding-right:24px}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#5a6b82;font-weight:400}
.stat .v{font-size:20px;font-weight:300;letter-spacing:-.2px;margin-top:3px}
.stat .v small{font-size:12px;color:var(--mute);margin-left:3px;letter-spacing:0}

/* hero side card */
.hero-side{position:absolute;right:24px;top:132px;width:306px;z-index:3}
.hs-card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);border-radius:12px;padding:18px 20px;box-shadow:var(--sh2);backdrop-filter:blur(12px)}
.hs-big{font-size:36px;font-weight:300;letter-spacing:-.9px;line-height:1.1;margin-top:6px}
.hs-big small{font-size:14px;color:var(--mute);margin-left:2px;letter-spacing:0}
.hs-sub{font-size:10.5px;color:var(--mute);margin-top:2px}
.hs-rows{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.hs-row{display:grid;grid-template-columns:1fr 54px 40px;gap:8px;align-items:center}
.hs-n{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs-b{height:3px;background:rgba(13,37,61,.1);border-radius:2px;overflow:hidden}
.hs-b i{display:block;height:100%;background:var(--primary);border-radius:2px}
.hs-v{font-size:11px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:1180px){.hero-side{display:none}}

/* ---------- verdict board ---------- */
.board{position:relative;margin-top:44px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh2);overflow:hidden}
.board-top{padding:32px 32px 0}
.board-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.board h2{font-size:26px;line-height:1.16;letter-spacing:-.64px;font-weight:300;margin:14px 0 0;max-width:980px}
.board-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:0;margin-top:24px;border-top:1px solid var(--line)}
.thesis{background:var(--navy);color:#fff;padding:32px;display:flex;flex-direction:column}
.thesis .eyebrow{color:rgba(255,255,255,.6);opacity:1}
.thesis p{font-size:15px;line-height:1.62;font-weight:300;color:rgba(255,255,255,.9);margin-top:12px}
.thesis-foot{margin-top:auto;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);display:flex;gap:24px;flex-wrap:wrap}
.thesis-foot .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.thesis-foot .v{font-size:13px;margin-top:3px;color:rgba(255,255,255,.92);line-height:1.45}
.points{padding:28px 32px;margin:0;list-style:none;display:flex;flex-direction:column;gap:18px;justify-content:center}
.points li{display:grid;grid-template-columns:20px 1fr;gap:12px}
.points .idx{font-size:11px;font-weight:400;color:var(--primary);letter-spacing:.04em;padding-top:2px}
.points .t{font-size:14px;font-weight:400;color:var(--ink)}
.points .d{font-size:13px;line-height:1.55;color:var(--mute);margin-top:3px}

/* ---------- sections ---------- */
.band{padding:64px 0}
.band.soft{background:var(--soft);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{max-width:1000px;margin-bottom:32px}
.sec-head h2{font-size:32px;font-weight:300;letter-spacing:-.64px;line-height:1.1;margin-top:10px}
.sec-head p{font-size:14px;line-height:1.6;color:var(--mute);margin-top:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.card-h h3{font-size:16px;font-weight:400;letter-spacing:-.1px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}

/* index cards */
.idx-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;transition:box-shadow .18s}
.idx-card:hover{box-shadow:var(--sh1)}
.idx-card .nm{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
.idx-card .code{font-size:10px;color:var(--mute);letter-spacing:.04em}
.idx-card .px{font-size:26px;font-weight:300;letter-spacing:-.26px;margin-top:8px}
.idx-card .chg{display:flex;gap:14px;margin-top:8px;font-size:12px}
.idx-card .chg span{color:var(--mute)}
.idx-card .chg b{font-weight:400;margin-left:4px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:var(--pill);padding:6px 12px;font-size:12px;color:var(--ink2)}
.chip b{font-weight:400;color:var(--ink);font-variant-numeric:tabular-nums}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;font-weight:400;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0 12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th:first-child{text-align:left}
.tbl th.sorted{color:var(--primary)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.42px;vertical-align:middle}
.tbl td:first-child{text-align:left}
.tbl tbody tr{cursor:pointer;transition:background .14s}
.tbl tbody tr:hover{background:var(--soft)}
.tbl tbody tr.active{background:rgba(83,58,253,.05)}
.tbl .nm-cell{display:flex;align-items:center;gap:10px}
.rank{width:22px;height:22px;border-radius:6px;background:var(--soft);color:var(--mute);font-size:11px;display:grid;place-items:center;font-weight:400;flex:0 0 auto}
.rank.top{background:var(--navy);color:#fff}
.ml-name{font-size:13.5px;font-weight:400;color:var(--ink);letter-spacing:0}
/* 排名变化：紧贴主线名，不用 emoji，靠符号与颜色表达方向 */
.rc{font-size:9.5px;font-weight:400;margin-left:5px;letter-spacing:0;font-variant-numeric:tabular-nums;cursor:help}
.rc.up{color:var(--up)}
.rc.down{color:var(--down)}
.ml-alias{font-size:11px;color:var(--mute);margin-top:2px;font-weight:300}
.bar{position:relative;height:4px;width:60px;border-radius:2px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--primary)}
.pill-stage{display:inline-flex;align-items:center;font-size:10.5px;padding:3px 9px;border-radius:var(--pill);letter-spacing:.02em;white-space:nowrap}
.st-ignition{background:#fdf1e4;color:#96601f}
.st-expansion{background:#eceaff;color:#4434d4}
.st-acceleration{background:#fde8ee;color:#c11a4f}
.st-divergence{background:#f8f2e2;color:#8a6416}
.st-fade{background:#eef1f5;color:#5b6b81}
.st-none{background:#eef1f5;color:#5b6b81}

/* detail */
.detail-top{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
.ring-wrap{text-align:center}
.ring{width:180px;height:180px}
.ring-num{font-size:30px;font-weight:300;fill:var(--ink);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.ring-lb{font-size:9px;fill:var(--mute);letter-spacing:.14em;text-transform:uppercase}
.factor-row{display:grid;grid-template-columns:96px 1fr 52px;gap:12px;align-items:center;padding:7px 0}
.factor-row .lb{font-size:12px;color:var(--ink2)}
.factor-row .tr{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.factor-row .tr i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.factor-row .vl{font-size:11.5px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.narr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.narr{background:var(--soft);border-radius:8px;padding:16px 18px}
.narr .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:400}
.narr .v{font-size:12px;line-height:1.62;color:var(--ink2);margin-top:8px}
.narr.bear{background:#fdf3f5;border:1px solid #f6dde3}
.narr.bear .k{color:#b13a5c}
.narr.bear .v{color:#7d2a44}
.driver{display:grid;grid-template-columns:74px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line)}
.driver:last-child{border-bottom:none}
.driver .dt{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;padding-top:2px}
.driver .tt{font-size:13.5px;font-weight:400;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:9.5px;padding:2px 7px;border-radius:4px;background:var(--soft);color:var(--mute);letter-spacing:.04em;border:1px solid var(--line)}
.tag.policy{background:#eceaff;color:#4434d4;border-color:#dcd8ff}
.tag.industry{background:#e8f6f1;color:#0d7a58;border-color:#cdede2}
.tag.earnings{background:#fdf1e4;color:#96601f;border-color:#f5e2c9}
.tag.event{background:#fde8ee;color:#c11a4f;border-color:#f9d3dd}
.driver .dd{font-size:12.5px;line-height:1.55;color:var(--mute);margin-top:5px}
.driver .src{font-size:10.5px;color:var(--mute);margin-top:5px}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.m-cell{background:#fff;padding:11px 12px}
.m-cell .k{font-size:10px;color:var(--mute);letter-spacing:.02em}
.m-cell .v{font-size:15px;margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tab{font-size:12.5px;padding:7px 14px;border-radius:var(--pill);border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--line-in)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.inval{display:flex;flex-wrap:wrap;gap:5px 10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:12.5px;line-height:1.55}
.inval:last-child{border-bottom:none}
/* 默认：条件独占一行，阈值整行铺在下方——避免长短文本互相挤压 */
.inval .cond{color:var(--ink2);flex:1 1 100%;min-width:0;overflow-wrap:anywhere}
.inval .thr{color:var(--mute);font-variant-numeric:tabular-nums;white-space:normal;overflow-wrap:anywhere;font-size:11.5px;background:var(--soft);padding:3px 8px;border-radius:4px;flex:1 1 100%;min-width:0;height:fit-content}
/* 阶段判定规则：标签与规则同行，标签收窄，规则列自适应 */
.inval.stage-rule{flex-wrap:nowrap;align-items:flex-start}
.inval.stage-rule .cond{flex:0 0 auto}
.inval.stage-rule .thr{flex:1 1 auto;background:transparent;padding:0;text-align:left;font-size:12px;color:var(--mute)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--primary)}

/* stage track */
.track{display:flex;gap:4px;margin-top:26px}
.track .seg{flex:1;text-align:center}
.track .bar2{height:4px;border-radius:2px;background:var(--line);margin-bottom:8px;position:relative;overflow:hidden}
.track .bar2 i{position:absolute;inset:0;background:var(--primary);transform-origin:left;transform:scaleX(0);transition:transform .5s cubic-bezier(.2,.7,.3,1)}
.track .seg.done .bar2 i{transform:scaleX(1);opacity:.32}
.track .seg.now .bar2 i{transform:scaleX(1)}
.track .lb{font-size:11px;color:var(--mute)}
.track .seg.now .lb{color:var(--ink);font-weight:400}
.track .seg.done .lb{color:var(--ink2)}

/* window visual */
.win-strip{display:flex;gap:3px;margin-top:18px;height:56px}
.win{position:relative;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.win .d{font-size:11px;font-weight:400;letter-spacing:.02em}
.win .r{font-size:10px;opacity:.72;line-height:1.3}
.win .w{position:absolute;right:8px;top:8px;font-size:9px;opacity:.6;letter-spacing:.04em}
.w-0{background:#f0f2f6;color:#4a5a70}
.w-1{background:#e9e7ff;color:#4434d4}
.w-2{background:var(--primary);color:#fff}
.w-3{background:#cfcaff;color:#2e2b8c}
.w-4{background:#f5e9d4;color:#8a6416}

/* rotation */
.rot-col h4{font-size:12px;font-weight:400;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
.rot-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.rot-item:last-child{border-bottom:none}
.rot-item .n{color:var(--ink2)}
.rot-item .v{font-variant-numeric:tabular-nums;font-size:12.5px}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-item{position:relative;padding:0 0 18px 0}
.tl-item:last-child{padding-bottom:0}
.tl-item:before{content:"";position:absolute;left:-19px;top:5px;width:7px;height:7px;border-radius:50%;background:#fff;border:1.5px solid var(--primary-sub)}
.tl-item.positive:before{background:var(--up);border-color:var(--up)}
.tl-item.negative:before{background:var(--down);border-color:var(--down)}
.tl-d{font-size:10.5px;color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.03em}
.tl-t{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45}

/* risks / scenarios */
.risk{border:1px solid var(--line);border-radius:10px;padding:18px 20px;background:#fff}
.risk-h{display:flex;align-items:center;gap:10px}
.lv{width:6px;height:6px;border-radius:50%;flex:0 0 auto}
.lv.high{background:var(--up)}
.lv.medium{background:#d79a2b}
.lv.low{background:#8d9bb0}
.risk h4{font-size:14px;font-weight:400}
.risk .d{font-size:12px;line-height:1.6;color:var(--mute);margin-top:10px}
.risk .kv{display:flex;gap:8px;margin-top:10px;font-size:11.5px;line-height:1.5}
.risk .kv b{font-weight:400;color:var(--ink2);flex:0 0 auto}
.risk .kv span{color:var(--mute)}

          "stage": "expansion",

        {
          "stage": "acceleration",
          "label": "加速期",
          "rule": "20 日涨幅 >25%，拥挤分位 >85，封板率 >75%"
        },
        {
          "stage": "divergence",
          "label": "分歧期",
          "rule": "5 日涨幅 < 20 日涨幅/4，份额分位 >90，连板高度回落 ≥2 级"
        },
        {
          "stage": "fade",
          "label": "退潮期",

        },
        {
          "term": "扩散度",

          "term": "相对强度 RS",

        }

  prompt: "# A股市场主线分析 · 提示词模板 v1.5\n\n> 用途：驱动任意具备联网/取数能力的 LLM 或 Agent，产出**可直接粘贴渲染**的结构化主线分析 JSON。\n> 配套：`schema/ashare-mainline.schema.json`（输出契约）· `samples/sample-report.json`（填好的参考样例）\n\n\n---\n\n## 0 · 角色\n\n你是一名 A 股市场结构研究员（sell-side strategy desk 视角）。你的专业不是预测指数点位，而是**识别资金与叙事正在哪里形成合力**，并给出可被证伪的观察条件。\n\n## 1 · 任务\n\n给定基准交易日 `{{AS_OF}}`，在全 A 股票池中识别当前市场**主线**——即同时满足「价格相对强度持续领先 + 成交额份额持续聚集 + 板块内扩散充分 + 有可验证的产业/政策/业绩叙事」的板块集群，并判断其所处**生命周期阶段**。\n\n输出：**一个 JSON 对象**，结构严格按 §9 骨架，规则严格按 §10 协议，不附加任何解释性文字。\n\n### 输入变量\n\n| 变量 | 含义 | 默认值 |\n|---|---|---|\n| `{{AS_OF}}` | 基准交易日（YYYY-MM-DD，须为交易日） | 最近一个已收盘交易日 |\n| `{{UNIVERSE}}` | 股票池 | 全 A，剔除 ST、退市整理、上市不足 60 日 |\n| `{{TOP_N}}` | 输出主线数量 | 3～5 |\n| `{{RISK_PROFILE}}` | 使用者风险偏好 | 中性 |\n| `{{DATA_SOURCES}}` | 可用数据源（若为空则按 §5 自选） | §5 P0 层 |\n| `{{OUTPUT_WRAP}}` | 是否包代码围栏：`plain`（纯文本直出）/ `fence`（包一层 ```json，需复制按钮时） | `plain` |\n\n---\n\n## 2 · 时间粒度：多周期共振（硬约束）\n\n**单一窗口必然失真**：太短会被单日脉冲欺骗，太长会把已经走完的行情当成进行中的主线，而更长的窗口又面临数据不可得。因此采用**四窗嵌套 + 一个长窗做分位**。\n\n| 窗口 | 交易日 | 角色 | 判断权重 | 为什么是这个长度 |\n|---|---|---|---|---|\n| T 日 | 1 | 仅作**确认/修正**，不单独构成判定 | 0%（只做修正，不计权重） | 单日涨停潮可能来自消息脉冲、指数调仓、期指交割，不具持续性含义 |\n| 短窗 | 5 | 趋势确认 + **脉冲过滤** | 20% | ≈1 个自然周，足以让消息驱动的资金露出真伪 |\n| 主窗 | 20 | **主判定窗口** | 45% | A 股题材情绪周期通常 15～40 个交易日；20 日 ≈ 一个完整发酵周期，可覆盖「启动—发酵—分歧」 |\n| 中窗 | 60 | 中期属性判定（真主线 vs 短炒） | 20% | ≈1 个季度，跨过一次财报或一次政策窗口 |\n| 长窗 | 250 | 历史分位（拥挤度、估值、波动） | 15%（用于 P3 闸门与惩罚） | ≈1 年，提供横截面分位的统计基础；再长则样本内制度变化过多 |\n\n合计 100%。\n\n> `turnover_share_pct_250` 同时用于 §3 P3 准入与 §6 R1/R2 惩罚：入榜门槛与扣分是两件事，不重复计分。\n\n> **判断权重 ≠ 打分权重**：上表仅表示证据分量，不进入 §6 `score`；`score` 只由六因子 `normalized × weight` 决定。\n\n**窗口落地规则**\n\n1. `effective_range` 必须写明起止日，并显式避开节假日（如国庆/春节休市）。\n2. 主窗 20 日按**交易日**回溯，不是自然日。\n3. T 日数据只允许出现在 `chg_1d`、`limit_up_count` 等**描述字段**中；**禁止**用 T 日排名变化直接改变 `stage`。\n4. 若 `{{AS_OF}}` 为节后首日，主窗顺延至节前收盘，避免跳空被误计为趋势。\n\n---\n\n## 3 · 反脉冲三原则（必须执行并写入 `persistence`）\n\n任何候选板块，在进入排名前先做三道体检，结果写入 `persistence.pulse_check`：\n\n| 编号 | 检验 | 量化阈值 | 用哪些字段验算 |\n|---|---|---|---|\n| **P1 持续性** | 20 日内进入涨幅前 10 名的天数 | ≥ 6 天（30%），且最近连续 ≥ 2 天 | `persistence.days_top10_20 ≥ 6` **且** `persistence.consecutive_top10 ≥ 2` |\n| **P2 广度** | 板块内上涨家数占比 与 创 20 日新高家数占比 | 上涨占比 ≥ 55% 且新高占比 ≥ 8% | `metrics.breadth_up_ratio ≥ 0.55` **且** `metrics.new_high_ratio ≥ 0.08` |\n| **P3 量能** | 成交额占全 A 比重 的 5 日变化 与 250 日分位 | Δ ≥ +0.5pct 且 分位 ≥ 60 | `metrics.turnover_share_chg_5 ≥ 0.005` **且** `metrics.turnover_share_pct_250 ≥ 0.60` |\n\n**判定（只管准入，不管阶段）**：三条中 **≥2 条成立** → 可进 `mainlines`；**仅 1 条成立** → 可进榜，但 `stage_confidence ≤ 0.5`，且不得标 `acceleration`（若 §4 判出 `acceleration`，降记为 `expansion` 并在 `score_breakdown` 之外的说明里写明「仅 1 条闸门成立」）；**0 条成立** → 不得进入 `mainlines`，只能进入 `rotation.emerging`。\n\n> **阶段只由 §4 判定**，本节不另设阶段规则，只压 `stage_confidence` 上限。\n\n`rules_passed` 必须是上表算出来的条数，`passed` 必须是 `rules_passed ≥ 2`——**这两个字段不允许写与 `metrics` 对不上的值**。`pulse_check.detail` 要逐条写出取值与判定（例：`P1 11/20 天但连续 0 天 ✗；P2 上涨 48% ✗；P3 份额 Δ5 −0.6pct ✗ → 0 条通过`），**detail 里的 ✗ 数量必须与 `rules_passed` 自洽**。\n\n**判据字段为 `null` 时**：该条记「无法判定」，不计入分子也不计入分母；若三条中可判定的不足 2 条，视为未通过闸门（不得进榜，豁免除外），并在 `detail` 写明哪几项缺数据。\n\n**存量豁免（只对 `fade` 生效，且优先于上一条判定）**：闸门每期重算，而退潮中的板块 P3 必然为负（份额在缩），若严格执行就会让 `fade` 永远无法出现在榜上——但读者恰恰需要看到「谁在退」。因此：\n\n1. 已在上一期 `mainlines` 中的主线，若本期只通过 ≤1 条，**允许保留 1 期**，但必须**同时**满足：`stage` 标 `fade`（且该 `stage` 是按 §4 判出来的，不是硬贴的）、`stage_confidence ≤ 0.6`、并在 `rotation.outflow` 中列出同名条目。\n2. **豁免只放宽准入，不放宽阶段**：若 §4 判出的阶段不是 `fade`，说明它并没有在退潮，应当移出榜单，而不是豁免。\n3. 新候选板块不享受豁免，0 条成立一律进 `rotation.emerging`。\n4. 豁免只能延续一期；下一期仍在榜且仍不过闸门，必须移出并在 `rotation.outflow` 说明去向。\n\n\n## 4 · 主线生命周期五阶段\n\n| 阶段 | 枚举值 | 盘面特征 | 量化阈值（满足 2 项以上） | 验算字段 |\n|---|---|---|---|---|\n| 启动 | `ignition` | 首次放量、龙头初现、广度快速抬升 | 份额 Δ5 ≥ +0.5pct；**近期才进前十**（`days_top10_20 ≤ 8`）；涨停 2～5 家 | `turnover_share_chg_5 ≥ 0.005`；`persistence.days_top10_20 ≤ 8`；`limit_up_count` ∈ [2,5] |\n| 发酵 | `expansion` | 梯队完整、扩散加速、轮动补涨 | 份额分位 60～85；涨停 ≥5 家；连板高度 3～4；上涨占比 ≥60% | `turnover_share_pct_250` ∈ [0.60,0.85]；`limit_up_count ≥ 5`；`max_streak` ∈ [3,4]；`breadth_up_ratio ≥ 0.60` |\n| 加速 | `acceleration` | 龙头加速、情绪高潮、成交占比飙升 | 20 日涨幅 >25%；拥挤分位 >85；封板率 >75% | `chg_20d > 0.25`；`crowding_pct > 0.85`；`seal_rate > 0.75` |\n| 分歧 | `divergence` | 高位放量滞涨、梯队断层、断板率升 | 5 日涨幅 < 20 日涨幅/4；份额分位 >90；连板高度回落 ≥2 级 | `chg_5d < chg_20d / 4`；`turnover_share_pct_250 > 0.90`；`max_streak_prev - max_streak ≥ 2` |\n| 退潮 | `fade` | 缩量下跌、龙头破位、资金撤离 | 份额 Δ20 < −0.5pct；龙头 5 日跌幅 >8%；上涨家数占比 <45% | `turnover_share_chg_20 < -0.005`；`leader_chg_5d < -0.08`；`breadth_up_ratio < 0.45` |\n\n**阶段冲突的裁决顺序（重要）**：一条主线可能同时满足多个阶段的条件（例如 `crowding_pct 0.92` 同时命中 `acceleration` 的「拥挤 >85」和 `divergence` 的「分位 >90」）。此时按 **`fade` → `divergence` → `acceleration` → `expansion` → `ignition`** 的顺序取第一个满足 ≥2 项的阶段——**越靠后的阶段优先级越高**，因为它描述的是更晚发生的状态。不允许「挑一个看起来最像的」，必须按顺序判。\n\n**判据缺失时**：某项判据所需字段为 `null`，该判据记为「无法判定」，不计入分子也不计入分母。若可判定的项不足 2 项，`stage` 写 `null`、`stage_confidence` 写 `null`，**不要猜一个阶段填空**。\n\n**阶段 ≠ 买卖建议。** `acceleration` 是风险最高的位置，`ignition` 是胜率最低但赔率最高的位置，二者都必须在 `narrative.bear_case` 中写明反向逻辑。\n\n---\n\n## 5 · 数据源分层与降级策略\n\n### P0 · 必需（免费、公开、稳定）\n\n| 数据 | 推荐来源 | 关键字段 |\n|---|---|---|\n| 板块/指数日线（含成交额） | 交易所官网；东方财富板块行情；中证/国证指数官网 | 开高低收、成交量额、换手 |\n| 概念板块成分与涨跌 | 东方财富概念板块；同花顺概念指数 | 成分股、板块涨跌幅 |\n| 涨停/跌停/连板池 | 东方财富涨停板行情（收盘后可得） | 涨停家数、连板数、封板资金、封板率 |\n| 个股资金流（**测算值**） | 东方财富个股/板块资金流 | 主力净额（超大单+大单） |\n| 两融余额 | 交易所融资融券数据（T+1 发布） | 融资余额、融券余额 |\n| 指数估值 | 中证指数官网、交易所 | PE/PB 及历史分位 |\n\n### 最小可算数据集（4 张表，指标都能算出来）\n\n`metrics` 的 23 个字段**不必逐个去取**。只要下面 4 张表到手，全部指标（含 `persistence` 三项、五阶段判据、R1/R2/R3 惩罚）都能算出来：\n\n| # | 表 | 必需字段 | 覆盖期 | 主要支撑 |\n|---|---|---|---|---|\n| 1 | 板块日线 | 日期、板块代码、收盘、成交额 | 260 交易日 | `chg_1d/5d/20d/60d`、`rs_5/20/60`、`turnover_share*`、`turnover_share_pct_250`、`volatility_20` |\n| 2 | 全 A 日线 | 日期、全 A 成交额、全 A 涨跌幅 | 260 交易日 | 份额的分母、`rs_*` 的分母 |\n| 3 | 板块成分股日线 | 日期、板块代码、代码、收盘、涨跌幅、是否涨停、连板数 | ≥25 交易日；分位类需 260 | `breadth_up_ratio`、`new_high_ratio`、`limit_up_count/ratio`、`max_streak`、`seal_rate`、`leader_chg_5d` |\n| 4 | 涨停池明细 | 日期、代码、所属板块、连板数、封板资金、开板次数 | ≥25 交易日 | `max_streak_prev`、`seal_rate`，也是 `days_top10_20` / `consecutive_top10` 的必要输入 |\n\n> **`crowding_pct` 的口径**：若无现成数据，按「板块成交额占全 A 比重的 250 日分位 × 0.5 ＋ 板块 20 日涨幅的 250 日分位 × 0.5」自建，并在 `data_quality.notes` 写明这个算式。它是 R2 与 `acceleration` 的触发变量，**不能既不留空也不说明来源**。\n\n### P1 · 建议（免费或低成本）\n\n- 龙虎榜（T 日晚间）、大宗交易、股东增减持\n- 业绩预告/快报（巨潮资讯、交易所公告）\n- 政策原文（发改委、工信部、国务院、部委官网）\n- 行业高频数据（产量、价格、开工率）\n\n### P2 · 可选（通常需付费/授权）\n\n- Wind / Choice / iFinD 一致预期与机构持仓\n- Level-2 逐笔、席位明细\n\n### 不可得数据的处理（重要）\n\n1. **禁止编造**。取不到就写 `null`，并在 `data_quality.missing` 中写明 `{field, reason, fallback}`。\n2. **禁止 0 填充**——0 与 null 在金融数据里含义完全不同。\n3. 降级顺序：精确值 → 代理指标 → 该因子记 0 并放大其余权重（**保留 6 行，不删字段**，具体做法见 §6「因子缺失时的权重处理」，并在 `data_quality.notes` 注明）。\n4. **已停止披露的指标不得使用**：沪深港通自 2024-08 起不再披露日度净买入/实时额度余额，仅有收盘后成交总额与港交所持股变动。**禁止**在日度因子里使用「北向净流入」；如需外资维度，改用「陆股通持股变动（周度）」并标注低频。\n5. 资金流为**算法测算值**（按单笔金额分档推断），必须在 `data_quality.notes` 标注口径，权重不得超过 10%。\n\n---\n\n## 6 · 打分卡\n\n```\nscore = Σ ( normalized_i × weight_i ) − penalty\n```\n\n| 因子 key | 含义 | 权重 | 归一化方法 |\n|---|---|---|---|\n| `rs` | 相对强度：20 日涨幅 ÷ 全 A 同期涨幅（比值，1.0 = 与大盘同步） | 25 | 该比值在全 A 板块中的横截面百分位 0～100 |\n| `persistence` | 趋势持续性：前 10 天数、连续天数、60 日方向一致性 | 20 | 三子项均值百分位 |\n| `volume` | 量能聚集：成交额份额 及其 5 日变化 | 20 | 分位 × 0.6 + Δ 分位 × 0.4 |\n| `breadth` | 扩散度：上涨占比、新高占比、涨停家数 | 15 | 加权百分位 |\n| `fundflow` | 资金流：5 日 / 20 日主力净额（测算） | 10 | 净额 / 流通市值 的百分位 |\n| `narrative` | 叙事与催化：政策/产业/业绩的可验证证据强度 | 10 | 见下方分档表 |\n\n`normalized` 是 0～100 的百分位，`contribution = normalized × weight / 100`，六项 `weight` 合计 100。\n\n**`rs` 的 `raw` 填什么**：填 `metrics.rs_20` 本身（比值，如 `1.213`），不填超额收益百分点。`raw` 与 `metrics.rs_20` **必须是同一个数**，页面会拿它们对照。\n\n**`narrative` 的归一化（可执行分档，不要再写「凭经验给分」）**\n\n1. 基础分（按 `drivers` 里**可验证**的条数，`verified !== true` 的不计）：0 条 → 0；1 条 → 40；2 条 → 60；3 条 → 75；≥4 条 → 85。\n2. 来源加分（只取**最高**等级的一条，不叠加）：官方原文 +15；公司公告 +10；主流财经媒体 +5；卖方研报 +0；社媒传闻 −10。\n3. `normalized = min(100, max(0, 基础分 + 来源加分))`，并在 `note` 写成 `3 条可验证证据(75) + 官方原文(+15) = 90`。\n\n**因子缺失时的权重处理（固定 6 项，不删行）**\n\n某项因子的底层数据取不到时：\n\n1. `score_breakdown` **仍然保留 6 行**，缺失那行 `normalized = 0`、**`weight = 0`**、`contribution = 0`，`note` 写「数据缺失，已从权重中剔除」。\n2. 其余五项 `weight` 按原比例放大，使 `Σ weight = 100`（例如缺 `fundflow`：25/20/20/15/10 → 27.8/22.2/22.2/16.7/11.1，保留 1 位小数并保证合计 100）。\n3. `appendix.weights` 同步用调整后的权重，并在 `data_quality.notes` 记一条。\n4. **不要**因为缺因子就把这一行删掉——删了会让 `Σ contribution` 与 `score` 对不上，也让读者看不出哪一项是空的。\n\n**闸门 vs 持续性因子**：`pulse_check` 是准入布尔值，`persistence` 是强度连续值；同源不同用途，`pulse_check` 条数**不得**折算进 `score`。\n\n**拥挤度惩罚 `penalty`（只减分；多项命中取最大值，不叠加）**\n\n| 编号 | 触发条件（需全部满足） | 扣分 |\n|---|---|---|\n| `R1` | `turnover_share_pct_250` > 0.95 且 `max_streak` ≥ 5 | 12 |\n| `R2` | `turnover_share_pct_250` > 0.90 且 `crowding_pct` > 0.90 | 6 |\n| `R3` | `chg_60d` > 0.60 且 `net_inflow_5_yi` < 0 | 8 |\n| 无触发 | — | 0 |\n\n1. **多个条件同时命中取最大值**，不累加，`penalty` 上限 12。\n2. 每个条件都必须能用 `metrics` 里已有的字段当场验算，**不得引入 `metrics` 之外的口径**（例如「波动率分位」这种没有对应字段的说法）。\n3. `penalty_reason` 必须写成可复算的一句话：编号 + 实际取值 + 算式。例：`R1 触发：份额分位 0.96 > 0.95 且 连板 5 ≥ 5 → −12`。\n4. 未触发时 `penalty = 0`、`penalty_reason = \"无触发\"`。**不要写 0.4、3.15 这类对不上上表的数。**\n\n`score_breakdown` 必须逐项列出 `raw / normalized / weight / contribution`，且 `Σ contribution − penalty` 与 `score` 的偏差 ≤ 0.5（自检项）。\n\n---\n\n## 7 · 执行流程\n\n| Step | 动作 | 产出字段 |\n|---|---|---|\n| **S1** | 取数、复权、剔除异常（停牌、ST、上市 <60 日、单日换手 >40% 的异动股） | `data_quality` |\n| **S2** | 横截面排名：1/5/20/60 日板块涨幅，成交额份额及其变化 | `metrics` |\n| **S3** | **反脉冲三原则校验 → 先过闸门，不合格的剔出候选池** | `persistence` |\n| **S4** | 因子归一化 → 加权 → 扣惩罚 → 排序取 Top N（只在 S3 的候选池里排） | `score`, `score_breakdown` |\n| **S5** | 阶段判定（§4） | `stage`, `stage_confidence` |\n| **S6** | 建立证据链：每条主线 ≥2 条驱动，含日期与来源；识别龙头/中军/补涨梯队 | `drivers`, `leaders`, `ladder` |\n| **S7** | 写证伪条件与情景推演：必须给出**可观测阈值** | `invalidation`, `scenarios` |\n\n**S3 必须在 S4 之前**：闸门是排序前剔除，不是排完再解释；S3 后合格候选不足 3 条时**如实少写**（`mainlines` 允许 3～5 条），并在 `data_quality.notes` 说明，不得放宽阈值凑数。\n\n**S6 证据标准**：来源优先级 = 官方原文 > 公司公告 > 主流财经媒体 > 卖方研报 > 社媒传闻。**社媒传闻不可单独作为驱动**；若无更高等级来源，须在 `detail` 中标注「未证实」。\n\n---\n\n## 8 · 语言规范\n\n- 用**概率化、条件化**表述：「若 X 跌破 Y，则主线成立概率下降」，不用「必涨/稳赚/满仓」。\n- 每条结论后跟可验证的观察项，而不是形容词。\n- 中文为主，专有名词保留英文（如 HBM、CoWoS）。\n- 数字：比率保留 4 位小数（0.0521），分数保留 1 位（87.6），金额统一「亿元」且字段名带 `_yi`。\n- 百分比一律用**小数**表示（5.21% → 0.0521），字段不携带 `%`。\n\n---\n\n## 9 · 输出骨架（键名照抄，不得增删改名）\n\n### 9.1 完整骨架\n\n实测体积：骨架约 **6K 字符**，3 条主线约 **20K**，5 条约 **32K**，硬上限 **40000**；装不下必然截断，故 §10-D 的排版与压缩规则是硬要求。\n\n下面这份骨架就是**唯一合法结构**。规则：\n\n- 所有键都必须出现。确实无数据时：字符串写 `null`、数组写 `[]`、对象按骨架给空值。\n- 数组元素结构必须与骨架中该数组的第 1 个元素完全一致。\n- 骨架里的示例值只用于示意**格式与单位**，不要照抄内容。\n- `metrics.rs_5 / rs_20 / rs_60` 是相对强度**比值**（板块区间涨幅 ÷ 全 A 同期涨幅，1.0 = 与大盘同步），不是超额收益的百分点。\n- `metrics.max_streak_prev` 是**5 个交易日前**的连板高度（不是\"上一个周期\"），`max_streak_prev - max_streak` 才是「连板回落级数」。\n- `metrics.leader_chg_5d` 是板块内**龙头个股**的 5 日涨跌幅，不是板块的 5 日涨幅（后者是 `chg_5d`）。\n- `metrics.turnover_share_chg_20` 是份额相对 **20 个交易日**前的变化，与 `turnover_share_chg_5` 不是同一个窗口。\n- 数组长度：`mainlines` = `{{TOP_N}}`（3～5）；`score_breakdown` = 6（六个因子各一项）；`drivers` 2～4；`leaders` 3～5；`invalidation` 2～4；`watch` 2～3；`risks` 3～5；`scenarios` 恰好 3；`points` 3～4；`rotation` 各 3～5；`timeline` 4～6；`appendix.weights` = 6。\n\n```json\n{\n  \"schema_version\": \"1.0.0\",\n  \"meta\": {\n    \"report_id\": \"aml-20261030\",\n    \"as_of\": \"2026-10-30\",\n    \"generated_at\": \"2026-10-31T09:00:00+08:00\",\n    \"title\": \"A股市场主线分析 · 2026-10-30\",\n    \"data_mode\": \"live\",\n    \"confidence\": 0.72,\n    \"analyst\": { \"model\": \"模型名\", \"prompt_version\": \"1.5.0\", \"operator\": \"使用者\" },\n    \"tags\": [\"算力\", \"机器人\"]\n  },\n  \"window\": {\n    \"as_of\": \"2026-10-30\",\n    \"primary_days\": 20,\n    \"confirm_days\": 5,\n    \"context_days\": 60,\n    \"quantile_days\": 250,\n    \"effective_range\": { \"start\": \"2026-09-24\", \"end\": \"2026-10-30\" },\n    \"rules\": [\"主窗按交易日回溯 20 日，非自然日\", \"T 日仅用于描述字段，不参与阶段判定\"],\n    \"excluded\": [{ \"date_range\": \"2026-10-01~2026-10-08\", \"reason\": \"国庆休市\" }]\n  },\n  \"data_quality\": {\n    \"status\": \"ok\",\n    \"coverage\": 0.92,\n    \"sources\": [{\n      \"name\": \"东方财富板块行情\",\n      \"category\": \"行情\",\n      \"fields\": [\"收盘\", \"成交 /* ============ 工具函数 ============ */
/* 数值收口：模型输出里的数字形态很脏——字符串（"87.6"）、带单位（"+3.2%"、"1,234.5亿"）、
   用百分数代替小数（5.21 想表达 5.21%）、以及 "N/A" 这类占位符。
   所有进入渲染的数字必须先过 toNum：字符串直接 .toFixed 会抛 TypeError，整页白屏。 */
const NA_RE = /^(n\/?a|n\.?a\.?|null|nil|none|undefined|nan|[+-]?inf(inity)?|—|–|-|\/|无|暂无|不适用|未提供|未知|待补|空)$/i;

function toNum(v){
  if(typeof v === 'number') return isFinite(v) ? v : null;
  if(v === null || v === undefined || typeof v === 'boolean') return null;
  let s = String(v).trim();
  if(!s || s.length > 40 || NA_RE.test(s)) return null;
  /* 全角数字/小数点先折成半角，中文输出里不算罕见 */
  s = s.replace(/[\uFF10-\uFF19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/\uFF0E/g, '.');
  s = s.replace(/[，,\s]/g, '').replace(/[%％]$/, '').replace(/^[+＋]/, '');
  s = s.replace(/(亿元|亿|万元|万|元|pct|百分点|个|家|倍|天|日)$/i, '');
  if(!s || s === '-' || s === '+') return null;
  const m = s.match(/^[+-]?(\d+(\.\d*)?|\.\d+)([eE][+-]?\d+)?/);
  if(!m) return null;
  const n = Number(m[0]);
  return isFinite(n) ? n : null;
}

    const c = Math.min(hi === undefined ? Infinity : hi, Math.max(lo === undefined ? -Infinity : lo, n));
    noteFix(path, raw, c, '越界钳制');
    return c;
  }
  return n;
}

const isN = v => toNum(v) === null;
const fixed = (v,d=1) => { const n = toNum(v); return n === null ? '—' : n.toFixed(d); };
const pct = (v,d=1) => { const n = toNum(v); return n === null ? '—' : (n*100).toFixed(d) + '%'; };
const pctS = (v,d=1) => { const n = toNum(v); return n === null ? '—' : (n>0?'+':'') + (n*100).toFixed(d) + '%'; };
const num = (v,d=1) => { const n = toNum(v); return n === null ? '—' : n.toFixed(d); };
const int = v => { const n = toNum(v); return n === null ? '—' : String(Math.round(n)); };
const yi = v => { const n = toNum(v); return n === null ? '—' : (n>0?'+':'') + n.toFixed(1) + '亿'; };
const tone = v => { const n = toNum(v); return n === null ? '' : (n > 0 ? 'up' : n < 0 ? 'down' : ''); };
const pctPoint = v => { const n = toNum(v); return n === null ? '—' : (n>0?'+':'') + (n*100).toFixed(1) + 'pct'; };

const STAGES = [

/* 阶段：查不到就是「未判定」，不回落成第一个阶段 */
function stageMeta(k){ return STAGES.find(s => s.key === k) || null; }
function stageIndex(k){ return STAGES.findIndex(s => s.key === k); }   /* -1 = 未判定 */
const STAGE_ALIAS = { '启动':'ignition','启动期':'ignition','发酵':'expansion','发酵期':'expansion','加速':'acceleration','加速期':'acceleration','分歧':'divergence','分歧期':'divergence','退潮':'fade','退潮期':'fade' };
function asStage(v){
  if(v === null || v === undefined || v === '') return null;
  const s = String(v).trim();
  const k = s.toLowerCase();
  if(stageMeta(k)) return k;
  return STAGE_ALIAS[s] || null;
}
function stageLabelOf(k, label){ if(label) return label; const s = stageMeta(k); return s ? s.label : '未判定'; }
function stageDesc(k){ const s = stageMeta(k); return s ? s.desc : '阶段未判定'; }
function stageClass(k){ return stageMeta(k) ? ('st-' + k) : 'st-none'; }

/* 非法枚举值不保留原样（页面上会露出英文/中文混杂的原始串），统一折成 null，由渲染层显示「未标注」 */
function enumPick(v, map){

/* ============ 契约体检 ============
   提示词里的硬规则本来就是机械可判的：P1/P2/P3 三条闸门、R1/R2/R3 三档惩罚、
   五个阶段的判据、六因子的算术。字段既然都在报告里，就不该只信任它写下的结论——
   这里按规则重算一遍，和记录值逐项比对。算不出来的时候（字段为 null）明确标「无法验算」，
   不用默认值冒充。 */
const STAGE_ORDER = ['fade','divergence','acceleration','expansion','ignition'];

function calcPulse(m){
  const mt = m.metrics || {}, ps = m.persistence || {};
  const d = toNum(ps.days_top10_20), c = toNum(ps.consecutive_top10);
  const up = toNum(mt.breadth_up_ratio), nh = toNum(mt.new_high_ratio);
  const d5 = toNum(mt.turnover_share_chg_5), q = toNum(mt.turnover_share_pct_250);
  return [
    { id:'P1', label:'持续性', ok:(d === null || c === null) ? null : (d >= 6 && c >= 2),
      text:'前10 ' + fixed(d,0) + '/20 天，连续 ' + fixed(c,0) + ' 天' },
    { id:'P2', label:'广度', ok:(up === null || nh === null) ? null : (up >= 0.55 && nh >= 0.08),
      text:'上涨 ' + pct(up,0) + '，新高 ' + pct(nh,1) },
    { id:'P3', label:'量能', ok:(d5 === null || q === null) ? null : (d5 >= 0.005 && q >= 0.60),
      text:'份额Δ5 ' + pctPoint(d5) + '，分位 ' + pct(q,0) }
  ];
}

function calcPenalty(m){
  const mt = m.metrics || {};
  const q = toNum(mt.turnover_share_pct_250), st = toNum(mt.max_streak), cw = toNum(mt.crowding_pct);
  const c60 = toNum(mt.chg_60d), f5 = toNum(mt.net_inflow_5_yi);
  const hits = [];
  if(q !== null && st !== null && q > 0.95 && st >= 5)
    hits.push({ id:'R1', value:12, why:'份额分位 ' + q.toFixed(2) + ' > 0.95 且连板 ' + st + ' ≥ 5' });
  if(q !== null && cw !== null && q > 0.90 && cw > 0.90)
    hits.push({ id:'R2', value:6, why:'份额分位 ' + q.toFixed(2) + ' > 0.90 且拥挤度 ' + cw.toFixed(2) + ' > 0.90' });
  if(c60 !== null && f5 !== null && c60 > 0.60 && f5 < 0)
    hits.push({ id:'R3', value:8, why:'60 日涨幅 ' + (c60 * 100).toFixed(1) + '% > 60% 且 5 日资金 ' + f5.toFixed(1) + ' 亿 < 0' });
  const verifiable = (q !== null && (st !== null || cw !== null)) || (c60 !== null && f5 !== null);
  return { value: hits.length ? Math.max.apply(null, hits.map(h => h.value)) : 0, hits: hits, verifiable: verifiable };
}

function calcStage(m){
  const mt = m.metrics || {}, ps = m.persistence || {};
  const c5 = toNum(mt.chg_5d), c20 = toNum(mt.chg_20d), q = toNum(mt.turnover_share_pct_250);
  const cur = toNum(mt.max_streak), prev = toNum(mt.max_streak_prev), seal = toNum(mt.seal_rate);
  const crowd = toNum(mt.crowding_pct), lu = toNum(mt.limit_up_count), up = toNum(mt.breadth_up_ratio);
  const d20 = toNum(mt.turnover_share_chg_20), lead = toNum(mt.leader_chg_5d), d5 = toNum(mt.turnover_share_chg_5);
  const days = toNum(ps.days_top10_20);
  const set = {
    fade: [
      ['份额Δ20 < −0.5pct', d20 === null ? null : (d20 < -0.005)],
      ['龙头 5 日跌幅 > 8%', lead === null ? null : (lead < -0.08)],
      ['上涨占比 < 45%', up === null ? null : (up < 0.45)]
    ],
    divergence: [
      ['5 日涨幅 < 20 日/4', (c5 === null || c20 === null) ? null : (c5 < c20 / 4)],
      ['份额分位 > 90', q === null ? null : (q > 0.90)],
      ['连板回落 ≥ 2 级', (cur === null || prev === null) ? null : (prev - cur >= 2)]
    ],
    acceleration: [
      ['20 日涨幅 > 25%', c20 === null ? null : (c20 > 0.25)],
      ['拥挤分位 > 85', crowd === null ? null : (crowd > 0.85)],
      ['封板率 > 75%', seal === null ? null : (seal > 0.75)]
    ],
    expansion: [
      ['份额分位 60~85', q === null ? null : (q >= 0.60 && q <= 0.85)],
      ['涨停 ≥ 5', lu === null ? null : (lu >= 5)],
      ['连板 3~4', cur === null ? null : (cur >= 3 && cur <= 4)],
      ['上涨占比 ≥ 60%', up === null ? null : (up >= 0.60)]
    ],
    ignition: [
      ['份额Δ5 ≥ +0.5pct', d5 === null ? null : (d5 >= 0.005)],
      ['20 日内进前十 ≤ 8 天', days === null ? null : (days <= 8)],
      ['涨停 2~5 家', lu === null ? null : (lu >= 2 && lu <= 5)]
    ]
  };
  const hits = {};
  let picked = null;
  /* 按 fade→divergence→acceleration→expansion→ignition 的顺序取第一个命中 ≥2 项的：
     越靠后的阶段优先级越高，因为它描述的是更晚发生的状态。 */
  STAGE_ORDER.forEach(k => {
    const list = set[k];
    const yes = list.filter(x => x[1] === true).length;
    const known = list.filter(x => x[1] !== null).length;
    hits[k] = { yes: yes, known: known, list: list };
    if(picked === null && yes >= 2) picked = k;
  });
  return { stage: picked, hits: hits };
}

function auditReport(r){
  const items = [], of = {};
  const add = (level, scope, text) => items.push({ level: level, scope: scope, text: text });
  const flag = (m, level, text) => { const k = String(m.id || m.name); (of[k] = of[k] || []).push({ level: level, text: text }); };
  const list = r.mainlines || [];
  const outNames = ((r.rotation && r.rotation.outflow) || []).map(x => String(x.name || '').trim());

  list.forEach(m => {
    /* --- 反脉冲：按 metrics 重算条数 --- */
    const pr = calcPulse(m);
    const known = pr.filter(x => x.ok !== null).length;
    const yes = pr.filter(x => x.ok === true).length;
    const pc = m.persistence && m.persistence.pulse_check ? m.persistence.pulse_check : {};
    const claimed = toNum(pc.rules_passed);
    const mark = pr.map(x => x.id + (x.ok === true ? '✓' : x.ok === false ? '✗' : '?')).join(' ');
    if(known > 0){
      if(claimed !== null && Math.round(claimed) !== yes)
        flag(m, 'err', '反脉冲实算 ' + yes + ' 条通过，报告写 ' + Math.round(claimed) + ' 条（' + mark + '）');
      if(typeof pc.passed === 'boolean' && pc.passed !== (yes >= 2))
        flag(m, 'err', 'pulse_check.passed 与实算不符：实算 ' + yes + ' 条，' + (yes >= 2 ? '应通过' : '应不通过'));
      if(yes < 2){
        const conf = toNum(m.stage_confidence);
        const exempt = m.stage === 'fade' && conf !== null && conf <= 0.6 && outNames.indexOf(String(m.name || '').trim()) >= 0;
        if(exempt) add('info', m.name, '未过闸门（' + yes + ' 条），按 §3 存量豁免保留 1 期');
        else flag(m, 'err', '未过 §3 闸门（' + yes + ' 条通过），不应出现在主线榜；退潮期存量需 stage=fade、置信度 ≤0.6 且列入轮动流出');
      }
    }

    /* --- 惩罚项：R1/R2/R3 重算，多项取最大值 --- */
    const cp = calcPenalty(m);
    const pen = toNum(m.penalty);
    if(cp.verifiable && pen !== null && Math.abs(cp.value - pen) > 0.01)
      flag(m, 'err', '惩罚项实算 ' + cp.value + ' 分，报告写 ' + fixed(pen, 2) + ' 分' +
        (cp.hits.length ? '（命中 ' + cp.hits.map(h => h.id).join(' / ') + '：' + cp.hits[0].why + '）' : '（R1/R2/R3 均未触发）'));

    /* --- 阶段：按判据重算 --- */
    const cs = calcStage(m);
    if(cs.stage && m.stage && cs.stage !== m.stage){
      const h = cs.hits[cs.stage];
      flag(m, 'warn', '阶段按判据应为「' + stageLabelOf(cs.stage) + '」（命中 ' + h.yes + ' 项：' +
        h.list.filter(x => x[1] === true).map(x => x[0]).join('、') + '），报告写「' + stageLabelOf(m.stage) + '」');
    }else if(!cs.stage && m.stage){
      let bestKey = null, bestN = -1;
      STAGE_ORDER.forEach(k => { if(cs.hits[k].yes > bestN){ bestN = cs.hits[k].yes; bestKey = k; } });
      if(bestN < 2) flag(m, 'warn', '阶段判据均不足 2 项（最多命中 ' + bestN + ' 项），「' + stageLabelOf(m.stage) + '」无法复算');
    }

    /* --- 打分卡算术 --- */
    const bd = m.score_breakdown || [];
    if(bd.length !== 6) flag(m, 'warn', '因子拆解 ' + bd.length + ' 项，契约为 6 项');
    const wsum = bd.reduce((s, b) => s + (toNum(b.weight) || 0), 0);
    if(bd.length && Math.abs(wsum - 100) > 0.05) flag(m, 'warn', '六因子权重合计 ' + fixed(wsum, 1) + '%，应为 100%');
    bd.forEach(b => {
      const nv = toNum(b.normalized), w = toNum(b.weight), c = toNum(b.contribution);
      if(nv !== null && w !== null && c !== null && Math.abs(nv * w / 100 - c) > 0.1)
        flag(m, 'warn', (b.label || b.key) + ' 的 contribution ' + fixed(c, 2) + ' 与 normalized×weight/100 = ' + (nv * w / 100).toFixed(2) + ' 不符');
    });
    const rsRow = bd.filter(b => b.key === 'rs')[0];
    const rs20 = toNum(m.metrics && m.metrics.rs_20);
    if(rsRow && rs20 !== null && toNum(rsRow.raw) !== null && Math.abs(toNum(rsRow.raw) - rs20) > 0.0005)
      flag(m, 'warn', 'rs 的 raw（' + fixed(rsRow.raw, 3) + '）与 metrics.rs_20（' + fixed(rs20, 3) + '）不是同一个数');
    const allCon = bd.length && bd.every(b => toNum(b.contribution) !== null);
    const ssum = allCon ? bd.reduce((s, b) => s + toNum(b.contribution), 0) : null;
    const rec = toNum(m.score);
    if(ssum !== null && pen !== null && rec !== null && Math.abs(ssum - pen - rec) > 0.5)
      flag(m, 'err', 'Σ贡献 ' + fixed(ssum, 2) + ' − 惩罚 ' + fixed(pen, 2) + ' = ' + fixed(ssum - pen, 2) + '，报告写 ' + fixed(rec, 1));

    /* --- 证据链 --- */
    const dn = (m.drivers || []).length;
    if(dn < 2) flag(m, 'warn', '驱动 ' + dn + ' 条，契约要求 2～4 条');
  });

  /* --- 全局一致性 --- */
  const sc = r.scenarios || [];
  if(sc.length !== 3) add('warn', '全局', '情景 ' + sc.length + ' 个，契约要求恰好 3 个');
  const probs = sc.map(s => toNum(s.probability));
  if(probs.length && probs.every(p => p !== null)){
    const ps = probs.reduce((a, b) => a + b, 0);
    if(Math.abs(ps - 1) > 0.011) add('warn', '全局', '情景概率合计 ' + (ps * 100).toFixed(1) + '%，应为 100%');
  }
  const mc = toNum(r.verdict && r.verdict.mainline_count);
  if(mc !== null && mc !== list.length) add('warn', '全局', 'verdict.mainline_count 写 ' + Math.round(mc) + '，实际 ' + list.length + ' 条');
  const ranks = list.map(m => toNum(m.rank));
  if(ranks.some((v, i) => v !== i + 1))
    add('warn', '全局', 'rank 不是从 1 连续编号：' + ranks.map(v => v === null ? '—' : Math.round(v)).join(', '));
  const scores = list.map(m => toNum(m.score));
  if(scores.length && scores.every(v => v !== null) && scores.some((v, i) => i > 0 && scores[i - 1] < v))
    add('warn', '全局', '主线未按分数降序排列');

  const err = items.filter(x => x.level === 'err').length + Object.keys(of).reduce((s, k) => s + of[k].filter(x => x.level === 'err').length, 0);
  const warn = items.filter(x => x.level === 'warn').length + Object.keys(of).reduce((s, k) => s + of[k].filter(x => x.level === 'warn').length, 0);
  /* 归一化层动过的手脚也要留痕：加载旧报告时没人会去翻导入诊断 */
  const fx = (r.__fixes || []).length;
  if(fx) add('info', '归一化', '有 ' + (r.__fixTotal || fx) + ' 处字段在渲染前被自动修正（字符串转数值、百分数折小数、非法枚举置空等），页面显示的是修正后的值，不是报告原文');
  return { items: items, of: of, err: err, warn: warn, total: err + warn, notes: items.filter(x => x.level === 'info').length };
}


/* 宽松归一化：结构可以补，结论不能补。
   缺失字段补成空数组 / 空对象 / 空串，但**数字与状态保持 null**——
   页面显示「—」或「未判定」，绝不用 0 分、0% 或默认阶段冒充结论。 */
function normalize(raw){
  NORM_FIXES = []; NORM_TOTAL = 0;
  const fixes = NORM_FIXES;
  const r = JSON.parse(JSON.stringify(raw || {}));
  const arr = v => Array.isArray(v) ? v : [];
  const obj = v => (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
  const str = (v, d) => (v === null || v === undefined) ? (d === undefined ? '' : d) : String(v).trim();
  const strs = v => arr(v).map(x => (x === null || x === undefined) ? '' : String(x));

  /* 数值：字符串转数值 → 百分数折回小数 → 区间钳制，每一步都记进 fixes */
  const numAt = (v, path, opt) => {
    const o = opt || {};
    let n = toNum(v);
    if(n === null){
      if(v !== null && v !== undefined && String(v).trim() !== '') noteFix(path, v, null, '无法识别→null');
      return null;
    }
    if(typeof v === 'string') noteFix(path, v, n, '字符串→数值');
    if(o.ratio && Math.abs(n) > 1){
      const s = n / 100;
      /* 涨幅类字段在 1~3 之间是真正的歧义区：1.05 既可能是 105%（真实翻倍），也可能是 1.05%。
         折算了也必须标出来，让人知道这里被动过。 */
      const amb = o.chg && Math.abs(n) <= 3;
      noteFix(path, v, s, amb ? '百分数→小数（原值 1~3，可能是真实涨幅，请复核）' : '百分数→小数');
      n = s;
    }

/* ============ 宽容 JSON 解析 ============
   模型输出的常见瑕疵：代码围栏、前言后语、尾逗号、注释、中文引号、
   Python 字面量（None/True）、中段截断。下面按「逐步加码」的方式
   生成候选文本，逐个尝试解析，取最像报告的那个。 */

/* 从 start 处的 { 或 [ 找到配对闭合位置，识别字符串与转义 */
function scanBalanced(s, start){
  const open = s.charAt(start);
  const close = open === '{' ? '}' : ']';
  let depth = 0, inStr = false, esc = false;
  for(let i = start; i < s.length; i++){
    const c = s.charAt(i);
    if(inStr){
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; continue; }
    if(c === open) depth++;
    else if(c === close){ depth--; if(depth === 0) return i; }
  }
  return -1;
}

/* 去掉字符串外的行注释与块注释 */
function stripComments(s){
  let out = '', inStr = false, esc = false;
  for(let i = 0; i < s.length; i++){
    const c = s.charAt(i), n = s.charAt(i + 1);
    if(inStr){
      out += c;
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; out += c; continue; }
    if(c === '/' && n === '/'){ while(i < s.length && s.charAt(i) !== '\n') i++; out += '\n'; continue; }
    if(c === '/' && n === '*'){ i += 2; while(i < s.length && !(s.charAt(i) === '*' && s.charAt(i + 1) === '/')) i++; i++; continue; }
    out += c;
  }
  return out;
}

/* 基础清洗：BOM、零宽字符、代码围栏、尾逗号、注释 */
function basicClean(t){
  let s = String(t == null ? '' : t);
  s = s.replace(/^\uFEFF/, '').replace(/[\u200B-\u200D\u2060\uFEFF]/g, '');
  s = s.replace(/^[ \t]*```[a-zA-Z0-9_+-]*[ \t]*$/gm, '').replace(/```/g, '');
  s = stripComments(s);
  s = s.replace(/,(\s*[}\]])/g, '$1');
  s = s.replace(/[\u00A0\u3000]/g, ' ');
  return s.trim();
}

function pyFix(t){
  return pyQuote(String(t).replace(/\bNone\b/g, 'null').replace(/\bTrue\b/g, 'true').replace(/\bFalse\b/g, 'false'));
}

/* 单引号字符串 → JSON 双引号字符串（Agent 常把 Python dict 直接吐出来） */
function pyQuote(t){
  const s = String(t);
  let out = '', i = 0, inD = false, esc = false;
  while(i < s.length){
    const c = s.charAt(i);
    if(inD){
      out += c;
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inD = false;
      i++;
      continue;
    }
    if(c === '"'){ inD = true; out += c; i++; continue; }
    if(c === "'"){
      i++; out += '"';
      while(i < s.length){
        const d = s.charAt(i);
        if(d === '\\'){
          const n = s.charAt(i + 1);
          if(n === "'"){ out += "'"; i += 2; continue; }
          if(n === '"'){ out += '\\"'; i += 2; continue; }
          out += d + n; i += 2; continue;
        }
        if(d === '"'){ out += '\\"'; i++; continue; }
        if(d === "'"){ out += '"'; i++; break; }
        out += d; i++;
      }
      continue;
    }
    out += c; i++;
  }
  return out;
}

/* 中文全角引号当分隔符用（模型常见）→ 半角，但只转换紧邻结构符号的那些 */
function smartFix(t){
  return String(t)
    .replace(/([\{\[,:\s])\u201C/g, '$1"')
    .replace(/\u201D(\s*[:,}\]])/g, '"$1');
}

/* 截断修复：在某个逗号处截断，补齐未闭合的括号 */
function closeUnbalanced(s){
  let inStr = false, esc = false, stack = [], cuts = [];
  for(let i = 0; i < s.length; i++){
    const c = s.charAt(i);
    if(inStr){
      if(esc) esc = false;
      else if(c === '\\') esc = true;
      else if(c === '"') inStr = false;
      continue;
    }
    if(c === '"'){ inStr = true; continue; }
    if(c === '{') stack.push('}');
    else if(c === '[') stack.push(']');
    else if(c === '}' || c === ']'){ if(stack.length) stack.pop(); }
    else if(c === ',') cuts.push({ i: i, open: stack.slice() });
  }
  const direct = s + stack.slice().reverse().join('');
  try{ JSON.parse(direct); return direct; }catch(e){}
  for(let k = cuts.length - 1; k >= 0 && k >= cuts.length - 60; k--){
    const body = s.slice(0, cuts[k].i);
    const cand = body + cuts[k].open.slice().reverse().join('');
    try{ JSON.parse(cand); return cand; }catch(e){}
  }
  return null;
}

/* 拆出文本中所有顶层 JSON 片段 */
function extractSegments(s){
  const out = [];
  for(let i = 0; i < s.length; i++){
    const c = s.charAt(i);
    if(c !== '{' && c !== '[') continue;
    const end = scanBalanced(s, i);
    if(end > i){ out.push(s.slice(i, end + 1)); i = end; }
  }
  return out;
}

/* 把各种包装形态归一到「带 mainlines 的报告对象」 */
/* 判断一个对象像不像「主线」：只有 name 不够——板块列表、驱动数组也都带 name。
   必须同时带上主线特有的量化字段，否则会把文本里任意一个对象数组当成 mainlines。 */
function looksLikeMainline(x){
  if(!x || typeof x !== 'object' || Array.isArray(x)) return false;
  if(!(x.name || x.id)) return false;
  return x.score !== undefined || x.stage !== undefined || x.score_breakdown !== undefined
      || x.rank !== undefined || x.metrics !== undefined || x.theme_type !== undefined;
}

function unwrapReport(d){
  if(!d || typeof d !== 'object') return null;
  if(Array.isArray(d)){
    const ok = d.length && d.every(looksLikeMainline);
    return ok ? { mainlines: d } : null;
  }
  const keys = ['mainlines', 'main_lines', 'lines', '主线'];
  for(const k of keys){
    if(d[k] && typeof d[k] === 'object') return fixMainlines(d, k);
  }
  if(d.report && typeof d.report === 'object') return unwrapReport(d.report);
  if(d.data && typeof d.data === 'object') return unwrapReport(d.data);
  if(d.result && typeof d.result === 'object') return unwrapReport(d.result);
  if(d.output && typeof d.output === 'object') return unwrapReport(d.output);
  if(looksLikeMainline(d)) return { mainlines: [d] };
  return d;
}

function fixMainlines(d, key){
  const v = d[key];
  if(!Array.isArray(v)){
    const list = Object.keys(v).map(k => v[k]).filter(x => x && typeof x === 'object');
    const copy = Object.assign({}, d);
    copy.mainlines = list;
    return copy;
  }
  if(key !== 'mainlines'){
    const copy = Object.assign({}, d);
    copy.mainlines = v;
    return copy;
  }
  return d;
}

/* 把内部标签翻成人话 */
function friendlyTag(tag){
  const map = {
    '原样': '内容本身即为合法 JSON',
    '基础清洗': '清洗后解析（去围栏 / 注释 / 尾逗号）',
    'Python 字面量': '按 Python 字面量修正后解析',
    '中文引号': '修正中文引号后解析',
    '综合修复': '多轮修复后解析',
    '多段合并': '多段输出按主线合并'
  };
  const cut = tag.indexOf('补齐截断') >= 0;
  if(cut) return '按截断修复后解析（已补齐括号，末尾内容可能缺失，建议让模型重发完整版）';
  const base = tag.split('·')[0];
  return (map[base] || base);
}

/* 多段合并：模型把报告拆成两次回复时，把几段 JSON 合成一份 */
function mergeReports(reps){
  const base = JSON.parse(JSON.stringify(reps[0]));
  const seen = {}, list = [];
  reps.forEach(r => (r.mainlines || []).forEach(m => {
    const key = String(m.id || m.name || '').trim();
    if(!key || seen[key]) return;
    seen[key] = 1; list.push(m);
  }));
  base.mainlines = list
    .sort((a, b) => (Number(b.score) || 0) - (Number(a.score) || 0))
    .map((m, i) => Object.assign({}, m, { rank: i + 1 }));
  const fill = ['window', 'data_quality', 'market_regime', 'verdict', 'rotation', 'playbook', 'appendix'];
  reps.slice(1).forEach(r => {
    fill.forEach(k => { if(!base[k] && r[k]) base[k] = r[k]; });
    ['risks', 'scenarios'].forEach(k => {
      if(!(base[k] && base[k].length) && r[k] && r[k].length) base[k] = r[k];
    });
  });
  if(base.verdict) base.verdict.mainline_count = base.mainlines.length;
  return base;
}

/* 主入口：返回 { data, notes:[], error } */
function parseJsonLoose(text){
  const raw = String(text == null ? '' : text);
  const notes = [];
  if(!raw.trim()) return { data:null, notes:notes, error:'内容为空' };

  const base = basicClean(raw);
  if(base !== raw.trim() && /```/.test(raw)) notes.push('已剥离代码围栏');
  if(/^\uFEFF/.test(raw) || /[\u200B-\u200D\u2060]/.test(raw)) notes.push('已清理不可见字符');
  if(/[\u201C\u201D]/.test(base)) notes.push('已修正中文引号');

  const variants = [
    { tag:'原样', text: raw },
    { tag:'基础清洗', text: base },
    { tag:'Python 字面量', text: pyFix(base) },
    { tag:'中文引号', text: smartFix(base) },
    { tag:'综合修复', text: basicClean(smartFix(pyFix(raw))) }
  ];

  const found = [];
  const seen = {};
  const tryText = (t, tag, allowCut) => {
    if(!t || seen[t]) return;
    seen[t] = 1;
    const push = (obj, how, cut) => {
      if(obj && typeof obj === 'object') found.push({ data:obj, tag:tag + (how ? '·' + how : ''), cut: !!cut, size: JSON.stringify(obj).length });
    };
    try{ push(JSON.parse(t)); return; }catch(e){}
    for(const seg of extractSegments(t)){
      try{ push(JSON.parse(seg)); }catch(e){}
    }
    if(allowCut){
      const fixed = closeUnbalanced(t.slice(Math.max(0, t.indexOf('{'))));
      if(fixed){ try{ push(JSON.parse(fixed), '补齐截断', true); }catch(e){} }
    }
  };

  variants.forEach(v => tryText(v.text, v.tag, true));
  if(!found.length) return { data:null, notes:notes, error:'未找到可解析的 JSON 结构（可能只输出了说明文字，或 JSON 未写完）' };

  let best = null, bestRank = -1;
  found.forEach(f => {
    const u = unwrapReport(f.data);
    const list = u && Array.isArray(u.mainlines) ? u.mainlines : null;
    /* 优先级：含 mainlines > 未截断 > 主线条数 > 体积。
       截断补齐的 5 条不能盖掉完整输出的 3 条——补出来的只是括号，
       缺的是 risks / scenarios / playbook 这些尾部字段。 */
    const rank = (list ? 1 : 0) * 1e18
               + (f.cut ? 0 : 1e15)
               + (list ? Math.min(list.length, 99) : 0) * 1e13
               + Math.min(f.size, 9e12);
    if(rank > bestRank){ bestRank = rank; best = { data:u || f.data, tag:f.tag, count: list ? list.length : 0, cut: !!f.cut }; }
  });

  // 多段合并：把几段独立 JSON 一起粘进来时合并主线，而不是只取其中一段
  const segs = extractSegments(base);
  if(segs.length > 1){
    const reps = [];
    segs.forEach(seg => {
      try{
        const o = unwrapReport(JSON.parse(seg));
        if(o && Array.isArray(o.mainlines) && o.mainlines.length) reps.push(o);
      }catch(e){}
    });
    if(reps.length > 1){
      const merged = mergeReports(reps);
      if(merged.mainlines.length > (best.count || 0)){
        best = { data: merged, tag: '多段合并', count: merged.mainlines.length, cut: false };
        notes.push('合并了 ' + reps.length + ' 段输出');
      }
    }
  }

  notes.push('识别方式：' + friendlyTag(best.tag));
  if(!best.count) return { data:best.data, notes:notes, error:'JSON 解析成功，但其中没有 mainlines 数组（当前版本要求至少 1 条主线）' };
  return { data:best.data, notes:notes, error:'', cut: !!best.cut };
}

/* ============ Vue 应用 ============ */
const { createApp, ref, computed, onMounted, onUnmounted, watch, nextTick } = Vue;

createApp({
  setup(){
    const STORAGE_KEY = 'aml-report-v1';
    let initial = EMBEDDED.sample;
    try{
      const saved = localStorage.getItem(STORAGE_KEY);
      if(saved){ initial = JSON.parse(saved); }
    }catch(e){}

    const report = ref(normalize(initial));
    /* 优先选中报告自己声明的主导主线，而不是永远选第一条 */
    const initialDom = report.value.verdict && report.value.verdict.dominant_mainline_id;
    const initialHit = initialDom ? report.value.mainlines.filter(m => m.id === initialDom || m.name === initialDom)[0] : null;
    const activeId = ref((initialHit || report.value.mainlines[0] || {}).id || '');
    const sortKey = ref('score');
    const sortDir = ref(-1);
    const tplTab = ref('prompt');
    const drawer = ref(null);          // 'template' | 'import'
    const importText = ref('');
    const importDiag = ref('');
    const importState = ref('');       // '' | 'ok' | 'warn' | 'err'
    const lastFixes = ref([]);         // 本次导入被自动修正的字段（最多展示 40 条）
    const lastFixTotal = ref(0);       // 实际修正次数（展示条数会截断，计数不截断）
    const toastMsg = ref('');
    const toastOn = ref(false);
    const fileEl = ref(null);
    let toastTimer = null;
    let lastFocus = null;              // 抽屉打开前的焦点，关闭后还回去

    function toast(msg){
      toastMsg.value = msg; toastOn.value = true;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastOn.value = false; }, 2200);
    }

    /* ---- 导航联动（scrollspy）----
       判定线取导航下方 96px：section 顶部越过该线即视为「当前所在」。 */
    const NAV = [
      { id:'verdict',  label:'结论' },
      { id:'regime',   label:'市场' },
      { id:'leaders',  label:'主线' },
      { id:'detail',   label:'拆解' },
      { id:'rotation', label:'轮动' },
      { id:'risk',     label:'风险' },
      { id:'method',   label:'口径' }
    ];
    const navId = ref(NAV[0].id);
    const navLinks = ref(null);   // .nav-links 容器，用于量取指示条位置
    let navPending = 0;       // 滚动节流定时器
    let navLockUntil = 0;     // 平滑滚动期间锁住高亮，避免途经的章节闪一下

    /* 把指示条对齐到当前页签的文字宽度上（不含左右内边距） */
    function moveInk(){
      const box = navLinks.value;
      if(!box) return;
      const el = box.querySelector('a.on');
      if(!el || !el.offsetWidth){ box.classList.remove('ink-on'); return; }
      const b = box.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      const cs = getComputedStyle(el);
      const padL = parseFloat(cs.paddingLeft) || 0;
      const padR = parseFloat(cs.paddingRight) || 0;
      box.style.setProperty('--ink-x', (r.left - b.left + padL).toFixed(2) + 'px');
      box.style.setProperty('--ink-w', Math.max(0, r.width - padL - padR).toFixed(2) + 'px');
      box.classList.add('ink-on');
    }

    function visibleSections(){
      return NAV.filter(s => {
        const el = document.getElementById(s.id);
        return el && el.getBoundingClientRect().height > 0;
      });
    }
    function syncNav(){
      if(Date.now() < navLockUntil) return;
      const LINE = 96;
      const list = visibleSections();
      if(!list.length) return;
      let cur = list[0].id;
      for(const s of list){
        const top = document.getElementById(s.id).getBoundingClientRect().top;
        if(top <= LINE) cur = s.id;
      }
      /* 滚到底时强制高亮最后一节：末尾章节若短于视口，其顶部可能永远到不了判定线 */
      const doc = document.documentElement;
      if(window.scrollY + window.innerHeight >= doc.scrollHeight - 2) cur = list[list.length - 1].id;
      if(navId.value !== cur) navId.value = cur;
    }
    /* 60ms 尾随节流：不用 rAF，避免标签页后台/不可见时回调不触发把标志位卡死 */
    function onNavScroll(){
      if(navPending) return;
      navPending = setTimeout(() => { navPending = 0; syncNav(); moveInk(); }, 60);
    }
    function jumpTo(s){
      navId.value = s.id;
      const el = document.getElementById(s.id);
      if(!el) return;
      /* 点击后交给 CSS 的 scroll-behavior 平滑滚动，锁住高亮直到滚动收敛 */
      navLockUntil = Date.now() + 700;
      setTimeout(() => { navLockUntil = 0; syncNav(); }, 760);
    }
    /* 抽屉的键盘约定：Esc 关闭，Tab 在抽屉内循环（不把焦点漏到背后的报告上） */
    function onKeydown(e){
      if(!drawer.value) return;
      if(e.key === 'Escape'){ e.preventDefault(); closeDrawer(); return; }
      if(e.key !== 'Tab') return;
      const box = document.querySelector('.drawer');
      if(!box) return;
      const nodes = box.querySelectorAll('a[href], button, textarea, input, select, [tabindex]:not([tabindex="-1"])');
      const list = Array.prototype.filter.call(nodes, el => !el.disabled && el.offsetParent !== null);
      if(!list.length) return;
      const first = list[0], last = list[list.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
    onMounted(() => {
      syncNav();
      nextTick(moveInk);
      /* 字体/布局落定后再量一次，避免首屏指示条偏半个字 */
      if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => nextTick(moveInk));
      window.addEventListener('scroll', onNavScroll, { passive:true });
      window.addEventListener('resize', onNavScroll);
      window.addEventListener('keydown', onKeydown);
    });
    onUnmounted(() => {
      window.removeEventListener('scroll', onNavScroll);
      window.removeEventListener('resize', onNavScroll);
      window.removeEventListener('keydown', onKeydown);
      clearTimeout(navPending);
    });
    /* 导入新数据或切换主线后，章节高度会变，重新量一次 */
    watch(report, () => nextTick(() => { syncNav(); moveInk(); }));
    watch(activeId, () => nextTick(syncNav));
    /* navId 变了才需要挪指示条，DOM 更新后再量 */
    watch(navId, () => nextTick(moveInk), { flush:'post' });

    /* ---- 计算属性 ---- */
    const mainlines = computed(() => report.value.mainlines);
    const active = computed(() => {
      const list = mainlines.value;
      return list.find(m => m.id === activeId.value) || list[0] || null;
    });
    const sortedMainlines = computed(() => {
      const list = [...mainlines.value];
      const k = sortKey.value, d = sortDir.value;
      const get = m => {
        if(k === 'score') return m.score;
        if(k === 'name') return m.name;
        return isN(m.metrics[k]) ? -1e9 : m.metrics[k];
      };
      return list.sort((a, b) => {
        const va = get(a), vb = get(b);
        if(typeof va === 'string') return d * va.localeCompare(vb, 'zh');
        return d * (va - vb);
      });
    });
    const totalWeight = computed(() =>
      (report.value.appendix.weights || []).reduce((s, w) => s + (toNum(w.weight) || 0), 0));
    /* 六项贡献之和：任何一项缺失就返回 null——宁可显示「—」，也不给一个看着完整的假和 */
    const sumContribution = computed(() => {
      const m = active.value; if(!m) return null;
      const list = m.score_breakdown || [];
      if(!list.length) return null;
      let s = 0;
      for(const b of list){ const c = toNum(b.contribution); if(c === null) return null; s += c; }
      return s;
    });
    /* 复算分：Σ贡献 − 惩罚。页面上会拿它和报告记录的 score 对照，不一致就标出来 */
    const recomputedScore = computed(() => {
      const m = active.value;
      const pen = m ? toNum(m.penalty) : null;
      return (sumContribution.value === null || pen === null) ? null : sumContribution.value - pen;
    });
    const scoreAudit = computed(() => {
      const m = active.value;
      const rec = recomputedScore.value;
      const got = m ? toNum(m.score) : null;
      if(rec === null || got === null) return null;
      const diff = rec - got;
      return { diff: diff, ok: Math.abs(diff) <= 0.5 };
    });
    /* 契约体检：报告写下的每个可复算结论，都按提示词的规则重算一遍 */
    const audit = computed(() => {
      const a = auditReport(report.value);
      const rows = a.items.slice();
      Object.keys(a.of).forEach(k => {
        const hit = report.value.mainlines.filter(m => String(m.id) === k)[0];
        const nm = (hit && hit.name) || k;
        a.of[k].forEach(f => rows.push({ level: f.level, scope: nm, text: f.text }));
      });
      const rank = { err: 0, warn: 1, info: 2 };
      a.rows = rows.sort((x, y) => (rank[x.level] || 9) - (rank[y.level] || 9));
      return a;
    });
    const activeFlags = computed(() => {
      const m = active.value;
      if(!m) return [];
      return (audit.value.of[String(m.id || m.name)] || []).slice();
    });
    /* 时效性：报告是"某一天"的快照，过期了就必须说 */
    const freshness = computed(() => {
      const day = (s) => {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
        if(!m) return null;
        const t = Date.UTC(+m[1], +m[2] - 1, +m[3]);
        return isFinite(t) ? t : null;
      };
      const asOf = day(report.value.meta.as_of);
      if(asOf === null) return null;
      const now = new Date();
      const today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
      const age = Math.floor((today - asOf) / 86400000);
      const until = day(report.value.verdict.horizon && report.value.verdict.horizon.valid_until);
      return {
        asOf: report.value.meta.as_of,
        age: age,
        stale: age > 7,
        expired: until !== null && until < today,
        validUntil: report.value.verdict.horizon ? report.value.verdict.horizon.valid_until : ''
      };
    });
    const windowStats = computed(() => [
      { k:'基准交易日', v:report.value.meta.as_of, s:'' },
      { k:'主判定窗口', v:report.value.window.primary_days, s:'交易日' },
      { k:'主线数量', v:mainlines.value.length, s:'条' },
      { k:'数据覆盖', v:pct(report.value.data_quality.coverage, 0), s:'' },
      { k:'结论置信度', v:pct(report.value.verdict.confidence, 0), s:'' }
    ]);
    const ringDash = computed(() => {
      const m = active.value; if(!m) return '0 326.7';
      const len = 2 * Math.PI * 52;
      return (scoreBar(m.score) / 100 * len).toFixed(1) + ' ' + len.toFixed(1);
    });
    const ringColor = computed(() => active.value ? scoreTone(active.value.score) : '#8d9bb0');
    const concentration = computed(() => {
      const list = [...mainlines.value]
        .sort((a, b) => (a.rank || 99) - (b.rank || 99))
        .slice(0, 3);
      const shares = list.map(m => toNum(m.metrics.turnover_share));
      const got = shares.filter(v => v !== null);
      /* 三条都有值才给"合计"；缺一条时只给部分和并标明条数——
         否则 2 条的和会被读成 3 条的合计。 */
      const full = got.length > 0 && got.length === list.length;
      return {
        items: list,
        total: full ? got.reduce((s, v) => s + v, 0) : null,
        partial: (!full && got.length) ? got.reduce((s, v) => s + v, 0) : null,
        got: got.length,
        of: list.length,
        max: Math.max(0.0001, ...got)
      };
    });

    /* ---- 交互 ---- */
    function selectMainline(id){ activeId.value = id; }
    function toggleSort(k){
      if(sortKey.value === k){ sortDir.value *= -1; }
      else { sortKey.value = k; sortDir.value = -1; }
    }
    function setReport(obj){
      const n = normalize(obj);
      report.value = n;
      lastFixes.value = n.__fixes || [];
      lastFixTotal.value = n.__fixTotal || (n.__fixes || []).length;
      const dom = (n.verdict && n.verdict.dominant_mainline_id) || '';
      const hit = dom ? n.mainlines.filter(m => m.id === dom || m.name === dom)[0] : null;
      activeId.value = (hit || n.mainlines[0] || {}).id || '';
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(n)); }catch(e){}
    }
    function exportJson(){
      const name = 'ashare-mainline-' + (report.value.meta.as_of || 'report') + '.json';
      const blob = new Blob([JSON.stringify(report.value, null, 2)], { type:'application/json;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);

      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

    function downloadText(name, text, type){
      const blob = new Blob([text], { type:(type || 'text/plain') + ';charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    }
    async function copyText(text, label){
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(text);
        }else{
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed'; ta.style.left = '-9999px';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy'); ta.remove();
        }

      }catch(e){ toast('复制失败，请手动选择文本'); }
    }
    function openDrawer(kind){
      lastFocus = document.activeElement;
      drawer.value = kind;
      if(kind === 'import'){ importText.value = ''; importDiag.value = ''; importState.value = ''; }
      nextTick(() => {
        const box = document.querySelector('.drawer');
        if(!box) return;
        const first = box.querySelector('textarea, input, button');
        if(first) first.focus();
      });
    }
    function closeDrawer(){
      const back = lastFocus;
      lastFocus = null;
      drawer.value = null;
      if(back && back.focus) nextTick(() => back.focus());
    }
    /* 导入诊断：把解析层与归一化层的修正都摊开，别让用户以为「显示出来的就是原件」 */
    function diagText(res, fixes, total){
      const n = (res.data && Array.isArray(res.data.mainlines)) ? res.data.mainlines.length : 0;
      const lines = [];
      if(res.error){
        lines.push('✕ ' + res.error);
      }else{
        lines.push((res.cut ? '⚠ 解析成功（按截断补齐，末尾内容可能缺失，建议让模型重发）· ' : '✓ 解析成功 · ') + n + ' 条主线');
      }
      if(res.notes && res.notes.length) lines.push(res.notes.join(' · '));
      const cnt = total || (fixes ? fixes.length : 0);
      if(fixes && fixes.length){
        const head = fixes.slice(0, 6).map(f => f.kind + ' ' + f.path + (f.from !== '' ? '（' + f.from + '）' : '')).join('\n· ');
        lines.push('自动修正 ' + cnt + ' 处' + (cnt > fixes.length ? '（展示前 ' + fixes.length + ' 条）' : '') +
                   '：\n· ' + head + (fixes.length > 6 ? '\n· ……' : ''));
      }
      return lines.join('\n');
    }
    function applyDiag(res, fixes, total){
      importState.value = res.error ? 'err' : (res.cut ? 'warn' : 'ok');
      importDiag.value = diagText(res, fixes, total);
    }
    function doImport(dryRun){
      const t = (importText.value || '').trim();
      if(!t){ importState.value = 'err'; importDiag.value = '✕ 请先粘贴 JSON 内容'; toast('请先粘贴 JSON 内容'); return; }
      const res = parseJsonLoose(t);
      let fixes = [], total = 0;
      if(!res.error){ try{ const n = normalize(res.data); fixes = n.__fixes || []; total = n.__fixTotal || fixes.length; }catch(e){} }
      applyDiag(res, fixes, total);
      if(res.error){ toast(res.error.slice(0, 30)); return; }
      const list = res.data.mainlines || [];
      if(dryRun){ toast('校验通过，共 ' + list.length + ' 条主线'); return; }
      setReport(res.data);
      drawer.value = null;
      toast('导入成功，共 ' + list.length + ' 条主线' + (total ? '（自动修正 ' + total + ' 处）' : ''));
      window.scrollTo({ top:0, behavior:'smooth' });
    }
    function onFile(e){
      const f = e.target.files && e.target.files[0];
      if(!f) return;

      };

          <div v-for="(step, i) in ['复制提示词 → 填入基准交易日','交由模型取数并推理','获得严格 JSON 输出','导入本页渲染报告']" :key="i"
               style="display:flex;gap:10px;padding:7px 0;font-size:12.5px;color:var(--ink2)">
            <span class="num" style="color:var(--primary);font-size:11px;padding-top:2px">0{{ i+1 }}</span>
            <span>{{ step }}</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div>
          <div class="brand" style="margin-bottom:12px"><span class="dot"></span>主线雷达<small>MAINLINE RADAR</small></div>
          <p>结构化 A 股主线分析框架。四窗嵌套时间粒度、反脉冲三原则、六因子打分卡、五阶段生命周期模型。</p>
        </div>
        <div>
          <h5>数据口径</h5>
          <ul>
            <li>主判定窗口：20 个交易日</li>
            <li>资金流：算法测算值</li>
            <li>拥挤度：250 日分位</li>
            <li>北向资金：不纳入日度因子</li>
          </ul>
        </div>
        <div>
          <h5>文件</h5>
          <ul>
            <li>prompt/ashare-mainline-prompt.md</li>
            <li>schema/ashare-mainline.schema.json</li>
            <li>samples/sample-report.json</li>
            <li>samples/empty-template.json</li>
          </ul>
        </div>
      </div>
      <div class="legal">
        本页内容为市场结构研究，不构成投资建议，不承诺任何收益。当前展示为
        <b style="font-weight:400">{{ report.meta.data_mode === 'demo' ? '示例数据（非真实行情）' : report.meta.data_mode === 'live' ? '实盘数据' : report.meta.data_mode === 'delayed' ? '延迟数据' : '来源未标注' }}</b>，
        所有资金流字段为按单笔金额分档推断的算法测算值，与真实成交存在偏差。使用者应自行核验数据并独立承担决策责任。
        <button class="link-btn" @click="resetDemo">恢复示例数据</button>
      </div>
    </div>
  </footer>

  <!-- ===== DRAWER ===== -->
  <div class="overlay no-print" v-if="drawer" @click.self="closeDrawer">
    <div class="drawer" role="dialog" aria-modal="true" :aria-label="drawer === 'import' ? '导入分析 JSON' : '提示词模板与输出契约'">
      <div class="drawer-h">
        <h3>{{ drawer === 'import' ? '导入分析 JSON' : '提示词模板与输出契约' }}</h3>
        <div class="spacer"></div>
        <span class="mute" style="font-size:10.5px">Esc 关闭</span>
        <button class="btn btn-quiet btn-sm" @click="closeDrawer">关闭</button>
      </div>

      <div class="drawer-b" v-if="drawer === 'import'">
        <div class="tabs">
          <button class="tab on">粘贴 JSON</button>
          <button class="tab" @click="fileEl && fileEl.click()">选择文件</button>
          <button class="tab" @click="importText = JSON.stringify(EMBEDDED.template, null, 2)">装入空白模板</button>
        </div>
        <textarea class="code" v-model="importText" placeholder="把模型输出的内容整段粘进来即可：纯 JSON、被 markdown 代码块包裹的 JSON、带前言后语的回答都能识别，不需要手动删除围栏。"></textarea>
        <input type="file" accept=".json,.jsonl,.txt,application/json,text/plain" ref="fileEl" @change="onFile" style="display:none">
        <div class="diag" v-if="importDiag" :class="importState">{{ importDiag }}</div>
        <p class="mute" style="font-size:11.5px;line-height:1.6;margin-top:12px">
          导入前会自动清洗：代码围栏、前后说明文字、尾逗号、注释、中文引号、Python 字面量（<code>None</code>/<code>True</code>）、以及中段被截断的 JSON（会尝试补齐括号）。
          数字写成字符串（<code>"87.6"</code>）、比率写成百分数（<code>5.21</code> 表示 5.21%）也会被自动折算，折算明细会列在上面的诊断里。
          <b style="font-weight:400;color:var(--ink2)">缺失的字段不会被补成 0</b>——页面上显示「—」或「未判定」，不会把没取到的数据伪装成结论。但 <code>mainlines</code> 数组必须存在。
        </p>
        <p class="mute" style="font-size:11.5px;line-height:1.6;margin-top:8px">
          从聊天网页版复制时，请点代码块右上角的复制图标——直接框选长代码块只会拿到可见部分。若模型分两次给出，把两段一起粘进来，会按主线自动合并。当前 {{ importText.length }} 字符。
        </p>
      </div>

      <div class="drawer-b" v-else>
        <div class="tabs">
          <button class="tab" :class="{on: tplTab==='prompt'}" @click="tplTab='prompt'">完整版（API/Agent）</button>
          <button class="tab" :class="{on: tplTab==='schema'}" @click="tplTab='schema'">JSON Schema</button>
          <button class="tab" :class="{on: tplTab==='blank'}" @click="tplTab='blank'">空白模板</button>
          <button class="tab" :class="{on: tplTab==='sample'}" @click="tplTab='sample'">当前数据</button>
        </div>

        <template v-if="tplTab==='prompt'">
          <div class="diag" style="margin:0 0 12px">
            用于 API / Agent / 有文件写入能力的运行环境。提示词约 {{ (EMBEDDED.prompt.length/1000).toFixed(1) }}K 字符，要求模型输出 20K～32K 字符的完整 JSON（3～5 条主线，上限 40K）；提示词 §10-D 已写明排版与压缩顺序。
          </div>
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn btn-primary btn-sm" @click="copyText(EMBEDDED.prompt, '完整提示词')">复制完整版</button>
            <button class="btn btn-quiet btn-sm" @click="downloadText('ashare-mainline-prompt.md', EMBEDDED.prompt)">下载 .md</button>
          </div>
          <pre class="code">{{ EMBEDDED.prompt }}</pre>
        </template>

        <template v-else-if="tplTab==='schema'">
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn btn-primary btn-sm" @click="copyText(JSON.stringify(EMBEDDED.schema, null, 2), 'JSON Schema')">复制 Schema</button>
            <button class="btn btn-quiet btn-sm" @click="downloadText('ashare-mainline.schema.json', JSON.stringify(EMBEDDED.schema, null, 2), 'application/json')">下载 .json</button>
          </div>
          <pre class="code">{{ JSON.stringify(EMBEDDED.schema, null, 2) }}</pre>
        </template>

        <template v-else-if="tplTab==='blank'">
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn btn-primary btn-sm" @click="copyText(JSON.stringify(EMBEDDED.template, null, 2), '空白模板')">复制模板</button>
            <button class="btn btn-quiet btn-sm" @click="downloadText('ashare-mainline-template.json', JSON.stringify(EMBEDDED.template, null, 2), 'application/json')">下载 .json</button>
          </div>
          <pre class="code">{{ JSON.stringify(EMBEDDED.template, null, 2) }}</pre>
        </template>

        <template v-else>
          <div style="display:flex;gap:10px;margin-bottom:12px">
            <button class="btn btn-primary btn-sm" @click="copyText(JSON.stringify(report, null, 2), '当前数据')">复制当前数据</button>
            <button class="btn btn-quiet btn-sm" @click="exportJson">导出 .json</button>
            <button class="btn btn-quiet btn-sm" @click="resetDemo">恢复示例数据</button>
          </div>
          <pre class="code">{{ JSON.stringify(report, null, 2) }}</pre>
        </template>
      </div>

      <div class="drawer-f" v-if="drawer === 'import'">
        <button class="btn btn-quiet btn-sm" @click="closeDrawer">取消</button>
        <button class="btn btn-quiet btn-sm" @click="doImport(true)">仅校验</button>
        <button class="btn btn-primary btn-sm" @click="doImport(false)">解析并渲染</button>
      </div>
    </div>
  </div>

  <div class="toast" :class="{on: toastOn}">{{ toastMsg }}</div>
</div>
`
}).mount('#app');
</script>
</body>
</html>
